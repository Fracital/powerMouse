<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Page unavailable</title>
		<link rel="stylesheet" href="/pm/main.css" />
		<style>
			/* The demo's own error page (ControllerInit.errorPage): served by the
			   service worker under the frame's URL when it could not produce the
			   document, with globalThis.stompError = { url, status, error, kind }
			   in the head. Styled like the landing page, since it shows inside the
			   same browser view. */
			html,
			body {
				height: 100%;
				margin: 0;
				overflow: auto;
			}
			body {
				display: grid;
				place-items: center;
			}
			main {
				max-width: 34rem;
				padding: 24px 28px;
				border: 1px solid #b6b6b6;
				border-radius: 5px;
				background: black;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 22px;
				color: #71cffe;
			}
			p {
				margin: 6px 0;
				line-height: 1.5;
			}
			code {
				word-break: break-all;
				color: #4ca9fb;
			}
			.detail {
				color: #f67;
			}
			button {
				margin-top: 14px;
				padding: 8px 18px;
				border: 0;
				border-radius: 5px;
				background: #e8ed58;
				color: #000;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button:hover {
				background: #fbff96;
			}
			button:active {
				background: #c1c55d;
			}
		</style>
	</head>
	<body>
		<main>
			<h1 id="title">Page unavailable</h1>
			<p>STomp could not load <code id="url"></code>.</p>
			<p id="detail" class="detail"></p>
			<button id="retry" type="button">Retry</button>
		</main>
		<script>
			const info = globalThis.stompError || {};
			const titles = {
				transport: 'Could not reach the site',
				timeout: 'The site took too long',
				routing: 'Something went wrong',
				blocked: 'Blocked by this host',
				controller: 'This proxy session has ended',
			};
			// the heading and the tab's title (the host hears the title)
			document.title = document.getElementById('title').textContent =
				titles[info.kind] || 'Page unavailable';
			document.getElementById('url').textContent = info.url || location.href;
			document.getElementById('detail').textContent = info.error
				? `${info.kind || 'error'}${info.status ? ` (${info.status})` : ''}: ${info.error}`
				: '';
			// In a dialed tab (docs/dialing.md) this page was written into the
			// call page, whose own reload would show the call page again and
			// nothing in it: the host reloads the tab, told over the port the
			// call left on the window (src/server/called.ts)
			const reload = () => {
				const called = window.$stomp$called;
				if (called && called.port) {
					try {
						called.port.postMessage({ op: 'navigate', reload: true });
						return;
					} catch {}
				}
				location.reload();
			};
			document.getElementById('retry').addEventListener('click', reload);
			// Tor mode (the /stomp-tor/ scope, or a dialed tab of the host's
			// Tor profile, pm/profile.js): a load that failed while the
			// browser's Tor client was still connecting says so, and loads
			// again by itself once Tor is ready. The client's state is the
			// host page's (pm/main.js __pmTorClient, which its transport
			// tells it); this page runs no inject and asks nothing of the
			// network.
			let torMode = location.pathname.startsWith('/stomp-tor/');
			try {
				torMode ||= top !== self && top.PMProfile?.tor === true;
			} catch {}
			if (torMode && (info.kind === 'transport' || info.kind === 'timeout')) {
				const tell = (status) => {
					const progress =
						status.progress != null ? ` (${status.progress}%)` : '';
					const why = `Tor is still connecting${progress}${status.summary ? `: ${status.summary}` : ''}.`;
					document.title = document.getElementById('title').textContent =
						'Tor is connecting';
					document.getElementById('detail').textContent =
						`${why} This page loads again by itself once Tor is ready.`;
				};
				let waited = false;
				const ask = async () => {
					let client = null;
					try {
						client = top.__pmTorClient ?? null;
					} catch {}
					const ready = client?.state === 'ready';
					// ready at once: the site itself failed, the page says so
					if (ready && !waited) return;
					if (ready) return reload();
					// no client to hear from, or one that gave up: nothing to wait for
					if (!client || client.state === 'failed') return;
					waited = true;
					tell(client);
					// at most every 2 s, and only while the page is shown
					setTimeout(ask, 2000);
				};
				ask();
			}
		</script>
	</body>
</html>
