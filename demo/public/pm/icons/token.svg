<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
	<!-- "Sign in with token": a Tango Butter key for the chrome button. The
	     token the user pastes is written straight into the proxied Discord
	     page's own localStorage in this same browser; it never leaves it. -->
	<defs>
		<linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fce94f" />
			<stop offset="1" stop-color="#edd400" />
		</linearGradient>
	</defs>
	<g fill="url(#key)" stroke="#c4a000" stroke-width="1.3" stroke-linejoin="round">
		<!-- the shaft and its two teeth, emerging from under the bow -->
		<path d="M9 10.7 H19.8 V15.3 H18 V13 H16.4 V15 H14.8 V13 H9 Z" />
		<!-- the bow: a gold disc with a punched hole, over the shaft root -->
		<path
			fill-rule="evenodd"
			d="M1.3 12 A5.7 5.7 0 1 1 12.7 12 A5.7 5.7 0 1 1 1.3 12 Z M4.2 12 A2.8 2.8 0 1 0 9.8 12 A2.8 2.8 0 1 0 4.2 12 Z"
		/>
	</g>
	<!-- a soft inner highlight around the hole, as the star has -->
	<circle
		cx="7"
		cy="12"
		r="4"
		fill="none"
		stroke="#fff"
		stroke-opacity="0.55"
		stroke-width="0.8"
	/>
</svg>
