<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>top navigation</title>
		<script src="top-nav.js"></script>
	</head>
	<body>
		<script>
			(function () {
				var query = new URLSearchParams(location.search);
				topNavRun({
					c: query.get('c'),
					k: query.get('k'),
					d: Number(query.get('d') || 0),
					p: query.get('p'),
				});
			})();
		</script>
	</body>
</html>
