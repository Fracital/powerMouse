<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>WEBSOCKET CLOSE</title>
	</head>
	<body>
		<script>
			// How a WebSocket ends, event by event, against the suite's server
			// (?port): a connection refused (?refused, a port nothing listens
			// on), a server that closes with no status, with a code and a
			// reason (4000, 1000, 1001 with none, a UTF-8 reason, a 123-byte
			// one) and without a close frame at all, and the page closing with
			// no code and with one. First, a page that replaced EventTarget
			// before its first WebSocket (?port /code): natively the socket's
			// events go through none of the page's class. Last, a page that
			// sends, closes and sends again, against a server that echoes
			// (/echo): natively nothing more goes out once close() is called,
			// bufferedAmount counts what was not sent, and no message is
			// dispatched while the socket is closing. And a buffer the page
			// sends stays the page's (natively it is not detached), counted
			// in bufferedAmount. And a burst of messages arrives, and comes
			// back, in the order it was sent (/order).
			const params = new URLSearchParams(location.search);
			const base = 'ws://127.0.0.1:' + params.get('port');
			const run = (url, onopen) =>
				new Promise((resolve) => {
					const events = [];
					const ws = new WebSocket(url);
					ws.onopen = () => {
						events.push('open ' + ws.readyState);
						onopen?.(ws);
					};
					ws.onerror = () => events.push('error ' + ws.readyState);
					ws.onmessage = (e) =>
						events.push('message ' + e.data + ' ' + ws.readyState);
					ws.onclose = (e) => {
						events.push(
							['close', e.code, e.reason, e.wasClean, ws.readyState].join(' '),
						);
						resolve(events.join(', '));
					};
					setTimeout(() => resolve(events.concat('timeout').join(', ')), 8000);
				});
			(async () => {
				const results = {};
				const OwnEventTarget = EventTarget;
				const calls = [];
				window.EventTarget = class extends OwnEventTarget {
					constructor() {
						super();
						calls.push('construct');
					}
					addEventListener(...args) {
						calls.push('listen ' + args[0]);
						return super.addEventListener(...args);
					}
					dispatchEvent(event) {
						calls.push('dispatch ' + event.type);
						return super.dispatchEvent(event);
					}
				};
				results.replacedEventTarget =
					(await run(base + '/code')) + '; page class: ' + calls.join(' ');
				window.EventTarget = OwnEventTarget;
				results.refused = await run(
					'ws://127.0.0.1:' + params.get('refused') + '/',
				);
				results.serverNoStatus = await run(base + '/quiet');
				results.serverCode = await run(base + '/code');
				results.serverNormal = await run(base + '/normal');
				results.serverAway = await run(base + '/away');
				results.serverUtf8 = await run(base + '/utf8');
				results.serverLong = await run(base + '/long');
				results.serverDrop = await run(base + '/drop');
				results.pageNoCode = await run(base + '/hold', (ws) => ws.close());
				results.pageCode = await run(base + '/hold', (ws) =>
					ws.close(3001, 'bye'),
				);
				const sent = [];
				results.sendAfterClose =
					(await run(base + '/echo', (ws) => {
						ws.send('before');
						ws.close();
						sent.push(ws.send('after'), ws.readyState, ws.bufferedAmount);
					})) +
					'; send: ' +
					sent.join(' ');
				const buffer = [];
				results.sendBuffer =
					(await run(base + '/echo', (ws) => {
						const data = new ArrayBuffer(10);
						const view = new Uint8Array(new ArrayBuffer(8), 2, 4);
						ws.send(data);
						ws.send(view);
						buffer.push(data.byteLength, view.byteLength, ws.bufferedAmount);
						ws.close();
					})) +
					'; ' +
					buffer.join(' ');
				// 24 messages of mixed sizes and kinds in one task: the server
				// (/order) reports the order it read them in once it has all,
				// and the page reads the order its echoes came back in
				const order = [];
				results.sendOrder =
					(await run(base + '/order', (ws) => {
						for (let i = 0; i < 24; i++) {
							const text =
								i + ' ' + ['x', '\u00e5', '\u5336', '\ud801\udc7e'][i % 4];
							if (i % 3 === 2) ws.send(new TextEncoder().encode(text));
							else ws.send(i % 5 === 4 ? text.repeat(5000) : text);
						}
						order.push(ws.bufferedAmount > 0);
						ws.onmessage = (e) => {
							const data = String(e.data);
							if (data.startsWith('read ')) {
								order.push(data);
								ws.close();
							} else order.push(data.split(' ')[0]);
						};
					})) +
					'; ' +
					order.join(' ');
				// what the constructor, close() and send() refuse, and in which
				// words: subprotocols that are no token or are there twice, a
				// close code outside 1000 and 3000-4999 (a [Clamp] conversion,
				// which cuts a fraction off), a reason over 123 bytes, a send
				// while connecting, and arguments that do not convert
				const thrown = (call) => {
					try {
						call();
						return 'none';
					} catch (error) {
						return [
							error.constructor.name,
							error.name,
							error.message,
							String(error.stack).split('\n')[0],
						].join(' | ');
					}
				};
				const checks = [];
				for (const args of [
					[Symbol()],
					[base + '/hold', Symbol()],
					[base + '/hold', 'a b'],
					[base + '/hold', ['a', 'b', 'a']],
					[base + '/hold', ['a', 'a', 'b c']],
					[base + '/hold', ''],
					[base + '/hold', 'a\0b\x7f'],
					[base + '/hold', '\x80\u00e9\ud800'],
					[base + '/hold', 'a\\b'],
					[base + '/hold', { toString: () => ({}) }],
					[base + '/hold', { [Symbol.iterator]: 5 }],
					['ftp://127.0.0.1/', ['a', 'a']],
					[base + '/hold#f', 'a b'],
				])
					checks.push(thrown(() => new WebSocket(...args).close()));
				const connecting = new WebSocket(base + '/hold');
				for (const args of [
					[1005, 'r'],
					[2999.5],
					['reason'],
					[NaN],
					[65536],
					[-1],
					[999.5],
					[1000, 'x'.repeat(124)],
					[undefined, 'x'.repeat(124)],
					[1n],
					[1000, Symbol()],
					[10, 'x'.repeat(200)],
					[{ valueOf: () => ({}) }],
				])
					checks.push(thrown(() => connecting.close(...args)));
				checks.push(
					thrown(() => connecting.send('a\udc00')),
					thrown(() => connecting.send(Symbol())),
					thrown(() =>
						connecting.send({
							toString() {
								throw new RangeError('mine');
							},
						}),
					),
				);
				connecting.close();
				results.argumentChecks = checks.join('; ');
				// a close() while connecting fails the connection: CLOSING at
				// once, then (a task later) an error and a close with 1006, not
				// clean, both reading CLOSED; what is sent meanwhile is counted
				results.closeConnecting = await new Promise((resolve) => {
					const events = [];
					const ws = new WebSocket(base + '/hold');
					ws.onopen = () => events.push('open');
					ws.onerror = () => events.push('error ' + ws.readyState);
					ws.onclose = (e) => {
						events.push(
							['close', e.code, e.reason, e.wasClean, ws.readyState].join(' '),
						);
						setTimeout(() => resolve(events.join(', ')), 300);
					};
					ws.close(4999.5, 'bye');
					ws.send('abc');
					events.push('closing ' + ws.readyState + ' ' + ws.bufferedAmount);
				});
				window.__wsClose = results;
			})();
		</script>
	</body>
</html>
