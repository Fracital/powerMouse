<!doctype html>
<title>DOWNLOAD</title>
<a id="plain" href="echo.json?download=plain" download>plain</a>
<a id="named" href="hdr.json?download=named" download="named.json">named</a>
<map name="m"
	><area id="area" href="sprite.svg?download=area" download shape="default"
/></map>
<img usemap="#m" src="sprite.svg" width="10" height="10" />
<a id="blob" download="blob.txt">blob</a>
<a
	id="disposition"
	href="download-attachment.json?download=disposition"
	download
	>disposition</a
>
<a id="stopped" href="echo.json?download=stopped" download="stopped.json"
	>stopped</a
>
<a id="cancelled" href="echo.json?download=cancelled" download>cancelled</a>
<script>
	// a handler that stops the click's propagation still downloads; one that
	// cancels it does not; what the page reads of defaultPrevented on the
	// way up is what the browser says
	const prevented = {};
	document
		.getElementById('stopped')
		.addEventListener('click', (event) => event.stopPropagation());
	document
		.getElementById('cancelled')
		.addEventListener('click', (event) => event.preventDefault());
	document.addEventListener('click', (event) => {
		prevented[event.target.id] = [event.defaultPrevented, event.returnValue];
	});
</script>
<script>
	// each link is clicked in turn; the browser saves what it fetched under
	// the name it chose, which the test compares with the real site's
	document.getElementById('blob').href = URL.createObjectURL(
		new Blob(['from a blob'], { type: 'text/plain' }),
	);
	const ids = [
		'plain',
		'named',
		'area',
		'blob',
		'disposition',
		'stopped',
		'cancelled',
	];
	ids.forEach((id, index) =>
		setTimeout(() => document.getElementById(id).click(), 300 + index * 700),
	);
	setTimeout(
		() => (window.__download = { done: true, prevented }),
		300 + ids.length * 700 + 1500,
	);
</script>
