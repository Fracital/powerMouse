<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>deferred refusals landed</title>
	</head>
	<body>
		<script>
			// Where the suite deferred-refusals' child goes when a link or a form
			// a frame of it aimed at it navigated it, or where a frame of the
			// child goes when the child's own link or form aimed at it by name
			// did: it answers for the window it landed in, to its parent.
			parent.postMessage(
				{ landed: location.search, reached: window.__nativeReached ?? null },
				'*',
			);
		</script>
	</body>
</html>
