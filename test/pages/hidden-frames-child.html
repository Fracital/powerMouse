<!doctype html>
<body style="margin: 0">
	<div id="box" style="width: 400px; height: 40px"></div>
	<script>
		// what this frame's animation frames do, reported to the top every
		// 100 ms: how many ran since the document started (`alive`: which
		// frames run right now is read off it, against a shown frame's), how
		// many ticks of the probe ran, what a measurement taken after a
		// double animation frame read (Google Sign-In's button does that),
		// and whether a callback cancelled while it waited ran anyway (one
		// that is not held has run before it is cancelled), and the order and
		// the frames three callbacks requested together ran in
		const report = {
			frame: location.hash.slice(1),
			alive: 0,
			ticks: 0,
			measured: [],
			cancelledRan: false,
			cancelled: false,
			order: '',
			times: [],
		};
		const breathe = () => {
			report.alive++;
			requestAnimationFrame(breathe);
		};
		requestAnimationFrame(breathe);
		const inner = new URLSearchParams(location.search).get('inner');
		if (inner) {
			const frame = document.createElement('iframe');
			frame.src = inner;
			document.body.append(frame);
		}
		// started by a "go" from the top, which the suite sends once every
		// frame has loaded and the ones Chrome holds have stopped: Chrome runs
		// a hidden frame's first frames before it holds it, later on a busy
		// machine. The callback to cancel is cancelled by a "cancel" from the
		// top, sent once a frame that is not held has long run it: by frames
		// counted, not by a timer a busy machine outruns
		let started = false;
		let pending = 0;
		const start = () => {
			if (started) return;
			started = true;
			const tick = () => {
				report.ticks++;
				requestAnimationFrame(tick);
			};
			requestAnimationFrame(tick);
			requestAnimationFrame(() =>
				requestAnimationFrame(() =>
					report.measured.push(document.getElementById('box').offsetWidth),
				),
			);
			pending = requestAnimationFrame(() => {
				report.cancelledRan = true;
			});
			for (const name of ['a', 'b', 'c'])
				requestAnimationFrame((time) => {
					report.order += name;
					report.times.push(time);
				});
		};
		addEventListener('message', (event) => {
			if (
				event.data !== 'hidden-frames-go' &&
				event.data !== 'hidden-frames-cancel'
			)
				return;
			for (let i = 0; i < frames.length; i++)
				frames[i].postMessage(event.data, '*');
			if (event.data === 'hidden-frames-go') return start();
			cancelAnimationFrame(pending);
			report.cancelled = true;
		});
		setInterval(() => top.postMessage({ ...report }, '*'), 100);
	</script>
</body>
