<!doctype html>
<title>OBJECT EVENTS</title>
<body>
	<!-- an <object>'s HTML document as the parser makes it, with a type -->
	<object
		id="parsed"
		data="object-events-doc.html?parsed"
		type="text/html"
	></object>
	<!-- one of an image with no type, as the parser makes it -->
	<object id="parsedImage" data="object-events.png?parsedImage"></object>
	<script>
		// What a page reads of an <object> while its HTML document loads and
		// once it has: the events it fires (each load with what the object
		// shows then), and right after it is put in the document, then at the
		// end, its type and data as the property and the attribute read them
		// and the title of the document it shows (null for none). With a type
		// and without, made by the parser and by a script, and two of an
		// image.
		const report = (window.__objectEvents = { done: false });
		const read = (object) => {
			let shown;
			try {
				const shownDocument = object.contentDocument;
				shown = shownDocument
					? `${JSON.stringify(shownDocument.title)} at ${shownDocument.URL}`
					: 'null';
			} catch (error) {
				shown = error.name;
			}
			return [
				`shown=${shown}`,
				`type=${object.type}`,
				`typeAttribute=${object.getAttribute('type')}`,
				`hasType=${object.hasAttribute('type')}`,
				`data=${object.getAttribute('data')}`,
				`matches=${object.matches('[type="text/html"]')}`,
				`width=${object.clientWidth}`,
			].join(' ');
		};
		const watch = (name, object) => {
			const events = (report[`${name}.events`] = []);
			object.addEventListener('load', () =>
				events.push(`load ${read(object)}`),
			);
			object.addEventListener('error', () => events.push('error'));
		};
		const parsed = document.getElementById('parsed');
		watch('parsed', parsed);
		report['parsed.sync'] = read(parsed);
		const made = (name, typed) => {
			const object = document.createElement('object');
			watch(name, object);
			object.data = `object-events-doc.html?${name}`;
			if (typed) object.type = 'text/html';
			document.body.append(object);
			// its window as the page's frames list holds it, read first
			try {
				report[`${name}.frame`] = frames[frames.length - 1].location.href;
			} catch (error) {
				report[`${name}.frame`] = error.name;
			}
			report[`${name}.sync`] = read(object);
			return object;
		};
		// one Chrome shows as an image: its type says so, or with none its
		// URL's extension. It has no context while the image loads, and
		// none after, at the image's size. Its type set after its URL, as a
		// page sets them one by one, before it is put in the document and
		// after; an <embed> too
		const image = (name, type, tag = 'object') => {
			const object = document.createElement(tag);
			watch(name, object);
			object.setAttribute(
				tag === 'object' ? 'data' : 'src',
				`object-events.png?${name}`,
			);
			if (type === 'before') object.setAttribute('type', 'image/png');
			document.body.append(object);
			if (type === 'after') object.setAttribute('type', 'image/png');
			report[`${name}.sync`] = read(object);
			return object;
		};
		const parsedImage = document.getElementById('parsedImage');
		watch('parsedImage', parsedImage);
		report['parsedImage.sync'] = read(parsedImage);
		// What else a page reads of an untyped object of an image while its
		// image loads, as its only child: its attributes every way the DOM
		// lists them, the ways to remove a type it has none of, its markup,
		// the selectors that name its type, its copies; and its observers'
		// records, of every attribute and of its type alone, with the old
		// values. Then the page's own type writes while it loads, each on an
		// object of its own: its type then, and the box it gets
		const records = {};
		const observe = (name, object) => {
			for (const [key, options] of [
				['records', { attributes: true, attributeOldValue: true }],
				['typeRecords', { attributeFilter: ['type'], attributeOldValue: true }],
			]) {
				const list = (records[`${name}.${key}`] = []);
				new MutationObserver((batch) => {
					for (const record of batch)
						list.push(`${record.attributeName}:${record.oldValue}`);
				}).observe(object, options);
			}
		};
		const held = (name, write) => {
			const holder = document.createElement('div');
			const object = document.createElement('object');
			watch(name, object);
			observe(name, object);
			object.setAttribute('data', `object-events.png?${name}`);
			holder.append(object);
			document.body.append(holder);
			const at = (key, ...values) =>
				(report[`${name}.${key}`] = values.map(String).join(' | '));
			if (write) {
				write(object);
				at(
					'written',
					object.getAttribute('type'),
					object.type,
					object.hasAttribute('type'),
					object.getAttributeNames(),
					object.outerHTML,
					object.matches('[type]'),
				);
			}
			report[`${name}.sync`] = read(object);
			if (write) return object;
			const attributes = object.attributes;
			at(
				'attributes',
				attributes.length,
				[...attributes].map((attr) => `${attr.name}=${attr.value}`),
				attributes.item(0)?.name,
				attributes.item(1),
				attributes.type,
				attributes.getNamedItem('type'),
				attributes.getNamedItemNS(null, 'type'),
				'type' in attributes,
				Object.getOwnPropertyNames(attributes),
			);
			at(
				'names',
				object.getAttributeNames(),
				object.getAttributeNode('type'),
				object.getAttributeNodeNS(null, 'type'),
				object.getAttributeNS(null, 'type'),
				object.hasAttributeNS(null, 'type'),
				object.hasAttributes(),
			);
			let removed;
			try {
				removed = attributes.removeNamedItem('type');
			} catch (error) {
				removed = error.name;
			}
			let removedNS;
			try {
				removedNS = attributes.removeNamedItemNS(null, 'type');
			} catch (error) {
				removedNS = error.name;
			}
			at(
				'removals',
				removed,
				removedNS,
				object.removeAttribute('type'),
				object.removeAttributeNS(null, 'type'),
				object.toggleAttribute('type', false),
				object.hasAttribute('type'),
			);
			at(
				'markup',
				object.outerHTML,
				holder.innerHTML,
				new XMLSerializer().serializeToString(object),
				holder.getHTML(),
			);
			at(
				'selectors',
				holder.querySelector('[type]'),
				holder.querySelector(':not([type])')?.localName,
				holder.querySelectorAll('[type], [TYPE="image/png"]').length,
				holder.matches(':has(> [type])'),
				holder.matches(':has(> :not([type]))'),
				object.matches(':is([type], [type=""])'),
				object.matches(':not([type])'),
				object.closest('[type]'),
				object.webkitMatchesSelector('[type]'),
				object.webkitMatchesSelector('[data]'),
				object.matches('[data]'),
			);
			const clone = object.cloneNode(true);
			const imported = document.importNode(object, true);
			const adopted = document.implementation
				.createHTMLDocument('')
				.adoptNode(object.cloneNode(true));
			at(
				'copies',
				clone.outerHTML,
				clone.getAttributeNames(),
				clone.hasAttribute('type'),
				clone.type,
				imported.getAttributeNames(),
				imported.attributes.length,
				adopted.outerHTML,
				adopted.getAttributeNames(),
			);
			// the copy put in the document, which loads the image of its own
			watch(`${name}Clone`, clone);
			holder.append(clone);
			report[`${name}Clone.sync`] = read(clone);
			return [object, clone];
		};
		const [heldImage, heldClone] = held('heldImage');
		const objects = {
			parsed,
			parsedImage,
			heldImage,
			heldImageClone: heldClone,
			typeImage: held('typeImage', (object) =>
				object.setAttribute('type', 'image/png'),
			),
			typeDocument: held('typeDocument', (object) =>
				object.setAttribute('type', 'text/html'),
			),
			typeBlank: held('typeBlank', (object) => object.setAttribute('type', '')),
			typeBlankRemoved: held('typeBlankRemoved', (object) => {
				object.setAttribute('type', '');
				object.removeAttribute('type');
			}),
			typeToggled: held('typeToggled', (object) =>
				object.toggleAttribute('type'),
			),
			typeProperty: held('typeProperty', (object) => {
				object.type = 'image/png';
			}),
			typeNode: held('typeNode', (object) => {
				const attr = document.createAttribute('type');
				attr.value = 'image/png';
				report['typeNode.replaced'] = String(
					object.attributes.setNamedItem(attr),
				);
			}),
			typed: made('typed', true),
			untyped: made('untyped', false),
			image: image('image', 'before'),
			imageLate: image('imageLate', 'after'),
			imageUntyped: image('imageUntyped', null),
			embedImage: image('embedImage', 'before', 'embed'),
			embedImageUntyped: image('embedImageUntyped', null, 'embed'),
		};
		setTimeout(() => {
			for (const [name, object] of Object.entries(objects)) {
				report[`${name}.end`] = read(object);
				report[`${name}.events`] = report[`${name}.events`].join(' | ');
			}
			for (const [key, list] of Object.entries(records))
				report[key] = list.join(' ');
			report.done = true;
		}, 4000);
	</script>
</body>
