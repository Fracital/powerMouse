<!doctype html>
<html>
	<head>
		<title>markup copies</title>
	</head>
	<body>
		<!--
			Responsive images and media, in the page and written and read
			through every markup API. A <source media> listens to its media
			query (Blink keeps a listened MediaQueryList alive as a pending
			activity) and an <img> can listen to the viewport of its document,
			so any copy of this markup that still holds one stays alive with its
			whole tree; a copy in the page's own document loads what it names.
			window.__run(name) runs one case ROUNDS times; the suite compares
			the nodes left after a GC, and the media fetched, with the page
			loaded natively.
		-->
		<div id="static"></div>
		<script>
			// a big static page of its own: the document the parser makes from it
			const FILLER = 400;
			const ROUNDS = 20;
			const picture = (n) =>
				`<picture><source media="(min-width: ${n}px)" srcset="blank-pixel.svg?p=${n}"><source media="(max-width: ${n}px)" srcset="blank-pixel.svg?q=${n}"><img src="blank-pixel.svg?i=${n}" alt=""></picture><img srcset="blank-pixel.svg?w=${n} 100w, blank-pixel.svg?x=${n} 200w" sizes="(min-width: 600px) 50vw, 100vw" alt="">`;
			const filler = (n) => {
				let out = '';
				for (let i = 0; i < n; i++) out += `<span class="f">${i}</span>`;
				return out;
			};
			const markup = () =>
				`<div class="m">${picture(1)}${filler(FILLER)}</div>`;
			const host = () => {
				const div = document.createElement('div');
				document.body.append(div);
				return div;
			};
			const cases = {
				innerHTMLSet() {
					const div = host();
					div.innerHTML = markup();
					div.remove();
				},
				innerHTMLGet() {
					const div = host();
					div.innerHTML = markup();
					for (let i = 0; i < 4; i++) void div.innerHTML;
					div.remove();
				},
				outerHTMLGet() {
					const div = host();
					div.innerHTML = markup();
					void div.outerHTML;
					div.remove();
				},
				outerHTMLSet() {
					const div = host();
					const inner = document.createElement('div');
					div.append(inner);
					inner.outerHTML = markup();
					div.remove();
				},
				insertAdjacentHTML() {
					const div = host();
					div.insertAdjacentHTML('beforeend', markup());
					div.remove();
				},
				contextualFragment() {
					const div = host();
					const range = document.createRange();
					range.selectNodeContents(div);
					div.append(range.createContextualFragment(markup()));
					div.remove();
				},
				setHTMLUnsafe() {
					const div = host();
					div.setHTMLUnsafe(markup());
					div.remove();
				},
				shadowRoot() {
					const div = host();
					const root = div.attachShadow({ mode: 'open' });
					root.innerHTML = markup();
					void root.innerHTML;
					div.remove();
				},
				getHTML() {
					const div = host();
					div.innerHTML = markup();
					void div.getHTML();
					div.remove();
				},
				xmlSerializer() {
					const div = host();
					div.innerHTML = markup();
					new XMLSerializer().serializeToString(div);
					div.remove();
				},
				templateInnerHTML() {
					const template = document.createElement('template');
					template.innerHTML = markup();
					document.body.append(template.content.cloneNode(true));
					for (const m of document.querySelectorAll('body > .m')) m.remove();
				},
				frameWrite() {
					// a child document the page writes, then drops
					const frame = document.createElement('iframe');
					document.body.append(frame);
					frame.contentDocument.open();
					frame.contentDocument.write(markup());
					frame.contentDocument.close();
					frame.remove();
				},
			};
			window.__cases = Object.keys(cases);
			window.__run = (name) => {
				for (let i = 0; i < ROUNDS; i++) cases[name]();
				return document.querySelectorAll('*').length;
			};
		</script>
		<script>
			// the static part: written by the parser, as a page's own markup
			let html = '';
			for (let i = 0; i < 8; i++) html += picture(i + 2);
			document.write(`<div id="written">${html}${filler(FILLER * 4)}</div>`);
		</script>
		<div id="parsed">
			<picture
				><source media="(min-width: 600px)" srcset="blank-pixel.svg?a" />
				<source media="(max-width: 599px)" srcset="blank-pixel.svg?b" />
				<img src="blank-pixel.svg?c" alt=""
			/></picture>
			<picture
				><source media="(min-width: 300px)" srcset="blank-pixel.svg?d" />
				<img src="blank-pixel.svg?e" alt=""
			/></picture>
			<img
				srcset="blank-pixel.svg?f 100w, blank-pixel.svg?g 200w"
				sizes="(min-width: 600px) 50vw, 100vw"
				alt=""
			/>
			<img
				loading="lazy"
				width="48"
				height="48"
				decoding="async"
				srcset="blank-pixel.svg?h 1x, blank-pixel.svg?j 2x"
				alt=""
			/>
			<img
				loading="lazy"
				width="48"
				height="48"
				src="blank-pixel.svg?k"
				alt=""
			/>
			<video muted autoplay loop>
				<source media="(min-width: 1px)" src="media-session.wav?video" />
			</video>
			<audio preload="auto" src="media-session.wav?audio"></audio>
		</div>
		<script>
			window.__ready = true;
		</script>
	</body>
</html>
