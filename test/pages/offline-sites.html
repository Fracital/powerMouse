<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Offline sites</title>
	</head>
	<body>
		<input id="box" autocomplete="off" />
		<ul id="suggestions"></ul>
		<script>
			// what a search page does (offline-html suite): suggestions for
			// what is typed by fetch and by XMLHttpRequest, its storage, its
			// history, a frame of its own and a WebSocket
			const box = document.getElementById('box');
			const list = document.getElementById('suggestions');
			const words = async (q) => {
				const response = await fetch(
					`offline-sites.json?q=${encodeURIComponent(q)}`,
				);
				const fetched = await response.json();
				const request = new XMLHttpRequest();
				request.open('GET', `offline-sites.json?via=xhr&q=${q}`);
				request.responseType = 'json';
				const xhr = await new Promise((resolve, reject) => {
					request.onload = () => resolve(request.response);
					request.onerror = reject;
					request.send();
				});
				return fetched.words
					.filter((word) => word.startsWith(q))
					.map((word) => `${word} ${xhr.words.indexOf(word)}`);
			};
			box.addEventListener('input', async () => {
				const q = box.value;
				const found = await words(q);
				if (box.value !== q) return;
				list.replaceChildren(
					...found.map((word) => {
						const item = document.createElement('li');
						item.textContent = word;
						return item;
					}),
				);
			});
			const report = {};
			const step = async (name, run) => {
				try {
					report[name] = await run();
				} catch (error) {
					report[name] = `${error.name}: ${error.message}`;
				}
			};
			addEventListener('load', async () => {
				await step('localStorage', () => {
					const was = localStorage.getItem('offline-sites');
					localStorage.setItem('offline-sites', 'kept');
					return [was, localStorage.getItem('offline-sites')];
				});
				await step('sessionStorage', () => {
					sessionStorage.setItem('offline-sites', 'session');
					return sessionStorage.getItem('offline-sites');
				});
				await step('pushState', async () => {
					history.pushState({ pushed: 1 }, '', '?pushed=1');
					const pushed = [location.search, history.state?.pushed];
					const popped = new Promise((resolve) =>
						addEventListener('popstate', () => resolve(location.search), {
							once: true,
						}),
					);
					history.back();
					return [...pushed, await popped];
				});
				await step('frame', async () => {
					const frame = document.createElement('iframe');
					frame.src = 'offline-sites-frame.html?from=parent';
					const loaded = new Promise((resolve) =>
						frame.addEventListener('load', resolve, { once: true }),
					);
					document.body.append(frame);
					await loaded;
					return [
						frame.contentDocument.title,
						frame.contentWindow.location.pathname,
						frame.contentWindow.location.search,
						frame.contentWindow.parentTitle,
					];
				});
				await step('webSocket', async () => {
					const socket = new WebSocket(`ws://${location.host}/ws-echo`);
					const told = await new Promise((resolve, reject) => {
						socket.onmessage = (event) => resolve(JSON.parse(event.data));
						socket.onerror = () => reject(new Error('socket error'));
					});
					return [told.url, told.origin === location.origin];
				});
				document.body.dataset.report = JSON.stringify(report);
			});
		</script>
	</body>
</html>
