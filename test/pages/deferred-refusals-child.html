<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>deferred refusals child</title>
	</head>
	<body>
		<script>
			// Each call (the names in the hash) as a page makes it: whether it
			// threw, or returned a promise and how that settled. Posted to the
			// parent.
			const outcome = async (run) => {
				try {
					const value = run();
					if (!value || typeof value.then !== 'function')
						return { returned: typeof value };
					try {
						await Promise.race([
							value,
							new Promise((resolve, reject) =>
								setTimeout(() => reject(new Error('pending')), 5000),
							),
						]);
						return { promise: 'resolved' };
					} catch (error) {
						return { promise: `rejected: ${error && error.message}` };
					}
				} catch (error) {
					return { threw: String(error && error.message) };
				}
			};
			const CALLS = {
				identity: () =>
					outcome(() =>
						navigator.credentials.get({ identity: { providers: [] } }),
					),
				disconnect: () =>
					outcome(() =>
						IdentityCredential.disconnect({
							configURL: new URL('deferred-refusals-idp.json', location.href)
								.href,
							clientId: 'x',
							accountHint: 'x',
						}),
					),
			};
			(async () => {
				const out = {};
				for (const name of location.hash.slice(1).split(','))
					out[name] = await CALLS[name]();
				parent.postMessage(
					{ out, reached: window.__nativeReached ?? null },
					'*',
				);
			})();
		</script>
	</body>
</html>
