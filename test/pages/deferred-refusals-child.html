<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>deferred refusals child</title>
	</head>
	<body>
		<script>
			// Each call (the names in the hash) as a page makes it: whether it
			// threw, or returned a promise and how that settled; an XHR's
			// document and the events it got. Posted to the parent.
			const outcome = async (run) => {
				try {
					const value = run();
					if (!value || typeof value.then !== 'function')
						return { returned: typeof value };
					try {
						await Promise.race([
							value,
							new Promise((resolve, reject) =>
								setTimeout(() => reject(new Error('pending')), 5000),
							),
						]);
						return { promise: 'resolved' };
					} catch (error) {
						return { promise: `rejected: ${error && error.message}` };
					}
				} catch (error) {
					return { threw: String(error && error.message) };
				}
			};
			const track = () =>
				document.createElement('canvas').captureStream().getVideoTracks()[0];
			const xmlDocument = () =>
				new Promise((resolve) => {
					const request = new XMLHttpRequest();
					const events = [];
					for (const name of ['load', 'error', 'loadend'])
						request.addEventListener(name, () => {
							events.push(name);
							if (name === 'loadend')
								resolve({ events, document: String(request.responseXML) });
						});
					try {
						request.open('GET', 'blank-sprite.svg');
						request.responseType = 'document';
						request.send();
					} catch (error) {
						resolve({ events, threw: String(error && error.message) });
					}
					setTimeout(() => resolve({ events, pending: true }), 5000);
				});
			const CALLS = {
				getUserMedia: () =>
					outcome(() => navigator.mediaDevices.getUserMedia({ video: true })),
				getCurrentPosition: () =>
					outcome(() =>
						navigator.geolocation.getCurrentPosition(
							() => {},
							() => {},
						),
					),
				watchPosition: () =>
					outcome(() =>
						navigator.geolocation.watchPosition(
							() => {},
							() => {},
						),
					),
				requestPermission: () =>
					outcome(() => Notification.requestPermission()),
				getSettings: () => outcome(() => track().getSettings()),
				applyConstraints: () =>
					outcome(() => track().applyConstraints({ deviceId: 'x' })),
				setSinkId: () => outcome(() => new Audio().setSinkId('x')),
				audioContext: () => outcome(() => new AudioContext({ sinkId: 'x' })),
				peer: () => outcome(() => new RTCPeerConnection()),
				// the other ways a page constructs one first
				peerSubclass: () =>
					outcome(() => new (class extends RTCPeerConnection {})()),
				peerReflect: () =>
					outcome(() => Reflect.construct(RTCPeerConnection, [])),
				webkitPeer: () =>
					typeof webkitRTCPeerConnection === 'function'
						? outcome(() => new webkitRTCPeerConnection())
						: { absent: true },
				// a member on an object no connection made: the browser's own
				// refusal, with or without the parts
				foreignStats: () =>
					outcome(() => RTCPeerConnection.prototype.getStats.call({})),
				misuse: () =>
					outcome(() => {
						const request = new XMLHttpRequest();
						request.responseType = 'json';
						return request.responseText;
					}),
				xmlDocument,
				identity: () =>
					outcome(() =>
						navigator.credentials.get({ identity: { providers: [] } }),
					),
				disconnect: () =>
					outcome(() =>
						IdentityCredential.disconnect({
							configURL: new URL('deferred-refusals-idp.json', location.href)
								.href,
							clientId: 'x',
							accountHint: 'x',
						}),
					),
				// a form a frame of this one submits to its parent, this
				// document: the copy this window submits, or nothing. Where it
				// lands, deferred-refusals-landed.html answers to its parent:
				// for this window when it lands here, to this window when it
				// lands in the frame (the browser's own submission: the form's
				// target reads `_self` to the browser)
				formAimed: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						addEventListener('message', (event) => {
							if (event.source === frame.contentWindow)
								resolve({ inFrame: event.data.out.formAimed.landed });
						});
						frame.srcdoc =
							'<form target="_parent" action="deferred-refusals-landed.html">' +
							'<input name="x" value="1"></form>' +
							'<script>document.forms[0].requestSubmit()<\/script>';
						document.body.append(frame);
						setTimeout(() => resolve({ stayed: true }), 2000);
					}),
				// an image in a new frame's about:blank, which no service worker
				// controls: its load is a copy (src/inject/dom/uncontrolledCopies.ts)
				blankCopy: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						document.body.append(frame);
						const blank = frame.contentDocument;
						const image = blank.createElement('img');
						image.onload = () => resolve({ loaded: true });
						image.onerror = () => resolve({ loaded: false });
						try {
							image.src = 'blank-sprite.svg';
							blank.body.append(image);
						} catch (error) {
							resolve({ threw: String(error && error.message) });
						}
						setTimeout(() => resolve({ pending: true }), 5000);
					}),
				// an XML document a frame loads through the XML shell (its load
				// is a part, src/inject/dom/instructions.ts loadXML): whether
				// its root's children landed
				xmlLoad: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						frame.onload = () => {
							try {
								const root = frame.contentDocument.documentElement;
								resolve({
									root: root.localName,
									landed: !!root.querySelector('symbol rect'),
								});
							} catch (error) {
								resolve({ threw: String(error && error.message) });
							}
						};
						frame.src = 'blank-sprite.svg';
						document.body.append(frame);
						setTimeout(() => resolve({ pending: true }), 5000);
					}),
				// a navigation of another window of the page's (a frame of its
				// own, by `w.location = url`): where the frame is after it
				// a call of no function through the access API: V8's message names
				// the page's expression (a part words it, src/inject/accessFailures.ts)
				// a worker's construction past its checks (src/inject/workerStart.ts)
				worker: () =>
					outcome(() => {
						const worker = new Worker('boom.js');
						worker.terminate();
						return worker;
					}),
				// a protocol handler's registration, accepted silently after the
				// browser's checks (src/inject/dom/protocolHandlers.ts)
				protocolHandler: () =>
					outcome(() =>
						navigator.registerProtocolHandler(
							'web+refusals',
							`${location.origin}/?%s`,
						),
					),
				// a WebSocket's and a WebSocketStream's construction
				// (src/inject/bareClient.ts socketStandIns): a URL with a fragment,
				// which the browser's own constructor refuses
				webSocket: () =>
					outcome(() => new WebSocket('wss://socket.invalid/#x')),
				webSocketStream: () =>
					outcome(() => new WebSocketStream('wss://socket.invalid/#x')),
				// the usage walk behind navigator.storage.estimate()
				// (src/inject/storageUsage.ts)
				estimate: () => outcome(() => navigator.storage.estimate()),
				notFunction: () =>
					outcome(() => {
						const o = {};
						const k = 'f';
						return o[k]();
					}),
				navigateOther: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						frame.onload = async () => {
							frame.onload = null;
							const result = await outcome(() => {
								frame.contentWindow.location =
									'deferred-refusals-landed.html?moved';
							});
							setTimeout(() => {
								let at;
								try {
									at = frame.contentWindow.location.search;
								} catch (error) {
									at = String(error && error.message);
								}
								resolve({ ...result, at });
							}, 2000);
						};
						frame.src = 'deferred-refusals-landed.html';
						document.body.append(frame);
					}),
				// a same-origin download link's click: the copy is saved after
				// the click went through the page (the suite counts downloads)
				download: () =>
					outcome(() => {
						const link = document.createElement('a');
						link.href = 'deferred-refusals.html';
						link.download = 'refusals.html';
						document.body.append(link);
						link.click();
					}),
			};
			(async () => {
				const out = {};
				for (const name of location.hash.slice(1).split(','))
					out[name] = await CALLS[name]();
				parent.postMessage(
					{ out, reached: window.__nativeReached ?? null },
					'*',
				);
			})();
		</script>
	</body>
</html>
