<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>deferred refusals child</title>
	</head>
	<body>
		<script>
			// Each call (the names in the hash) as a page makes it: whether it
			// threw, or returned a promise and how that settled; an XHR's
			// document and the events it got. Posted to the parent.
			// an image of the fixture's other host: another origin's
			const crossImage = () =>
				new Promise((resolve, reject) => {
					const url = new URL('object-events.png', location.href);
					url.hostname =
						url.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
					const element = new Image();
					element.onload = () => resolve(element);
					element.onerror = () => reject(new Error('no image'));
					element.src = url.href;
				});
			const outcome = async (run) => {
				try {
					const value = run();
					if (!value || typeof value.then !== 'function')
						return { returned: typeof value };
					try {
						await Promise.race([
							value,
							new Promise((resolve, reject) =>
								setTimeout(() => reject(new Error('pending')), 5000),
							),
						]);
						return { promise: 'resolved' };
					} catch (error) {
						return { promise: `rejected: ${error && error.message}` };
					}
				} catch (error) {
					return { threw: String(error && error.message) };
				}
			};
			// A frame of this one, deferred-refusals-aimed.html, whose `kind` of
			// form or link it aims at this window as it loads (a fetched
			// document: an srcdoc's shell is a part too): where it lands (deferred-refusals-landed.html answers for
			// the window it lands in, to its parent: for this window, to the
			// suite, when it lands here; to this window when it lands in the
			// frame, the browser's own navigation, since the form's or link's
			// target reads `_self` to the browser), or that it stayed, and what
			// the frame's submit() threw
			const aimedFrom = (kind) =>
				new Promise((resolve) => {
					const frame = document.createElement('iframe');
					let threw;
					addEventListener('message', (event) => {
						if (event.source !== frame.contentWindow) return;
						if ('threw' in event.data) threw = event.data.threw;
						else resolve({ inFrame: event.data.landed });
					});
					frame.src = `deferred-refusals-aimed.html?${kind}`;
					document.body.append(frame);
					setTimeout(() => resolve({ stayed: true, threw }), 2000);
				});
			// A frame of this one named `name`, on its initial about:blank, that
			// `aim(name)` aims a link or a form of this document at: where the
			// frame is after it, and what `aim` returned
			const aimedAt = (name, aim) =>
				new Promise((resolve) => {
					const frame = document.createElement('iframe');
					frame.name = name;
					document.body.append(frame);
					addEventListener('message', (event) => {
						if (event.source === frame.contentWindow)
							resolve({ inFrame: event.data.landed, threw });
					});
					const threw = aim(name);
					setTimeout(() => {
						let at;
						try {
							at = frame.contentWindow.location.href;
						} catch (error) {
							at = String(error && error.message);
						}
						resolve({ stayed: true, threw, at });
					}, 2000);
				});
			const track = () =>
				document.createElement('canvas').captureStream().getVideoTracks()[0];
			const xmlDocument = () =>
				new Promise((resolve) => {
					const request = new XMLHttpRequest();
					const events = [];
					for (const name of ['load', 'error', 'loadend'])
						request.addEventListener(name, () => {
							events.push(name);
							if (name === 'loadend')
								resolve({ events, document: String(request.responseXML) });
						});
					try {
						request.open('GET', 'blank-sprite.svg');
						request.responseType = 'document';
						request.send();
					} catch (error) {
						resolve({ events, threw: String(error && error.message) });
					}
					setTimeout(() => resolve({ events, pending: true }), 5000);
				});
			// a policy of the page's own, which allows the code the csp calls make
			// and refuses their frame
			// (the inject judges it: its checks are a deferred part,
			// src/inject/dom/policyChecks.ts), in a meta the page inserts once
			// the calls before it ran
			const policed = () => {
				if (document.querySelector('meta[http-equiv]')) return;
				const meta = document.createElement('meta');
				meta.httpEquiv = 'Content-Security-Policy';
				meta.content =
					"script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; frame-src 'none'";
				document.head.append(meta);
			};
			const CSP_CALLS = {
				// code made from a string: an EvalError's refusal, or 2
				cspEval: () => outcome(() => eval('1 + 1')),
				// an inline script the page inserts: whether it ran
				cspScript: () => {
					window.__cspRan = false;
					const script = document.createElement('script');
					script.textContent = 'window.__cspRan = true';
					try {
						document.body.append(script);
					} catch (error) {
						return { threw: String(error && error.message) };
					}
					return { ran: window.__cspRan };
				},
				// an inline style the page inserts: whether it applies
				cspStyle: () => {
					const box = document.createElement('div');
					box.id = 'policed';
					document.body.append(box);
					const style = document.createElement('style');
					style.textContent = '#policed { color: rgb(1, 2, 3); }';
					try {
						document.head.append(style);
					} catch (error) {
						return { threw: String(error && error.message) };
					}
					return { color: getComputedStyle(box).color };
				},
				// a frame its frame-src refuses (loadRefusal): whether its document
				// is the one it was sent to
				cspFrame: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						frame.onload = () => {
							let title;
							try {
								title = frame.contentDocument?.title ?? null;
							} catch (error) {
								title = null;
							}
							resolve({ title });
						};
						try {
							frame.src = 'deferred-refusals-landed.html?frame';
						} catch (error) {
							resolve({ threw: String(error && error.message) });
						}
						document.body.append(frame);
						setTimeout(() => resolve({ pending: true }), 5000);
					}),
			};
			for (const [name, call] of Object.entries(CSP_CALLS))
				CSP_CALLS[name] = () => {
					policed();
					return call();
				};
			// A document the page makes in a new frame of its own (`setup`
			// gives it), whose shell is a part: its script posts the origin
			// it reads, the page's own where the shell ran first, the
			// proxy's where its markup ran unrewritten; nothing where the
			// frame was given no document of it
			const MADE = (origin) =>
				`<script>parent.postMessage({ made: ${origin} }, '*')<\/script>`;
			const made = (setup) =>
				new Promise((resolve) => {
					const frame = document.createElement('iframe');
					addEventListener('message', (event) => {
						if (
							event.source === frame.contentWindow &&
							typeof event.data?.made === 'string'
						)
							resolve({
								ran:
									event.data.made === location.origin
										? 'injected'
										: event.data.made,
							});
					});
					document.body.append(frame);
					try {
						setup(frame);
					} catch (error) {
						resolve({ threw: String(error && error.message) });
						return;
					}
					setTimeout(
						() =>
							resolve({
								ran: false,
								srcdoc: frame.hasAttribute('srcdoc'),
								src: frame.getAttribute('src'),
							}),
						3000,
					);
				});
			// an <object>'s HTML document, which the page's frame shows as a
			// copy in its shell (src/htmlShell.ts, the object branch of
			// src/inject/dom/modules/DOMAttributes.ts): whether its script ran
			// (it posts where it landed), the events the object fired, and the
			// title of the document it shows (one the page can read: the copy is
			// of the page's origin)
			const objectDocument = (typed) =>
				new Promise((resolve) => {
					const object = document.createElement('object');
					const events = [];
					let landed = null;
					addEventListener('message', (event) => {
						if (event.source === object.contentWindow && event.data?.landed)
							landed = event.data.landed;
					});
					object.onload = () => events.push('load');
					object.onerror = () => events.push('error');
					object.data = `deferred-refusals-landed.html?${typed ? 'typed-' : ''}object`;
					if (typed) object.type = 'text/html';
					document.body.append(object);
					setTimeout(() => {
						let shown;
						try {
							const inner = object.contentDocument;
							shown = inner ? inner.title : null;
						} catch (error) {
							shown = String(error && error.message);
						}
						resolve({ landed, events, shown });
					}, 4000);
				});
			const CALLS = {
				...CSP_CALLS,
				// a frame sandboxed to an opaque origin under a header policy of
				// its own that governs code (deferred-refusals-opaque.html), whose
				// checks are made at its first script: what it posted, null when
				// none of its code ran (the suite reads the rest in the frame,
				// by its name)
				cspOpaque: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						frame.name = `cspOpaque-${Math.random().toString(36).slice(2)}`;
						frame.sandbox = 'allow-scripts';
						addEventListener('message', (event) => {
							if (event.source === frame.contentWindow && event.data?.opaque)
								resolve({ name: frame.name, posted: event.data.opaque });
						});
						frame.src = 'deferred-refusals-opaque.html';
						document.body.append(frame);
						setTimeout(() => resolve({ name: frame.name, posted: null }), 4000);
					}),
				srcdoc: () =>
					made((frame) => {
						frame.srcdoc = MADE('self.origin');
					}),
				// a data: document's frame (src/inject/dom/rareAttributes.ts)
				dataFrame: () =>
					made((frame) => {
						frame.src = `data:text/html,${encodeURIComponent(MADE('"data"'))}`;
					}),
				// a refresh meta a script puts in a frame's document
				// (rareAttributes.ts): where the frame goes
				refresh: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						addEventListener('message', (event) => {
							if (event.source !== frame.contentWindow) return;
							const landed = event.data?.landed;
							if (landed === '?refreshed') resolve({ refreshed: true });
							if (landed !== '?first') return;
							const meta = frame.contentDocument.createElement('meta');
							meta.httpEquiv = 'refresh';
							try {
								meta.content = '0;url=deferred-refusals-landed.html?refreshed';
								frame.contentDocument.head.append(meta);
							} catch (error) {
								resolve({ threw: String(error && error.message) });
							}
							setTimeout(() => resolve({ stayed: true }), 3000);
						});
						frame.src = 'deferred-refusals-landed.html?first';
						document.body.append(frame);
					}),
				// a javascript: URL's markup too large for the worker to serve
				// (src/inject/Client.ts INLINE_DOCUMENT_MAX): the shell is the
				// page's (dom/Client.ts javascriptDocument)
				javascriptDocument: () =>
					made((frame) => {
						frame.src = `javascript:${JSON.stringify(MADE('self.origin'))}+' '.repeat(4200000)`;
					}),
				getUserMedia: () =>
					outcome(() => navigator.mediaDevices.getUserMedia({ video: true })),
				getCurrentPosition: () =>
					outcome(() =>
						navigator.geolocation.getCurrentPosition(
							() => {},
							() => {},
						),
					),
				watchPosition: () =>
					outcome(() =>
						navigator.geolocation.watchPosition(
							() => {},
							() => {},
						),
					),
				requestPermission: () =>
					outcome(() => Notification.requestPermission()),
				getSettings: () => outcome(() => track().getSettings()),
				applyConstraints: () =>
					outcome(() => track().applyConstraints({ deviceId: 'x' })),
				setSinkId: () => outcome(() => new Audio().setSinkId('x')),
				audioContext: () => outcome(() => new AudioContext({ sinkId: 'x' })),
				peer: () => outcome(() => new RTCPeerConnection()),
				// the other ways a page constructs one first
				peerSubclass: () =>
					outcome(() => new (class extends RTCPeerConnection {})()),
				peerReflect: () =>
					outcome(() => Reflect.construct(RTCPeerConnection, [])),
				webkitPeer: () =>
					typeof webkitRTCPeerConnection === 'function'
						? outcome(() => new webkitRTCPeerConnection())
						: { absent: true },
				// a member on an object no connection made: the browser's own
				// refusal, with or without the parts
				foreignStats: () =>
					outcome(() => RTCPeerConnection.prototype.getStats.call({})),
				misuse: () =>
					outcome(() => {
						const request = new XMLHttpRequest();
						request.responseType = 'json';
						return request.responseText;
					}),
				xmlDocument,
				identity: () =>
					outcome(() =>
						navigator.credentials.get({ identity: { providers: [] } }),
					),
				disconnect: () =>
					outcome(() =>
						IdentityCredential.disconnect({
							configURL: new URL('deferred-refusals-idp.json', location.href)
								.href,
							clientId: 'x',
							accountHint: 'x',
						}),
					),
				// a form a frame of this one submits to its parent, this
				// document: the copy this window submits, or nothing. Where it
				// lands, deferred-refusals-landed.html answers to its parent:
				// for this window when it lands here, to this window when it
				// lands in the frame (the browser's own submission: the form's
				// target reads `_self` to the browser)
				formAimed: () => aimedFrom('form'),
				// the same, by submit(), which throws without the part
				submitAimed: () => aimedFrom('submit'),
				// a sandboxed frame of this one sets a part of this window's
				// location, which a sandboxed document may not navigate (whether
				// it may is a part, src/inject/dom/navigateOther.ts mayNavigate):
				// what it threw, and whether this window's hash moved
				sandboxedHash: () =>
					new Promise((resolve) => {
						const hash = location.hash;
						const frame = document.createElement('iframe');
						frame.sandbox = 'allow-scripts allow-same-origin';
						addEventListener('message', (event) => {
							if (event.source === frame.contentWindow)
								setTimeout(
									() =>
										resolve({
											threw: event.data.threw,
											moved: location.hash !== hash,
										}),
									500,
								);
						});
						// (a fetched document: an srcdoc's shell is a part too)
						frame.src = 'deferred-refusals-aimed.html?hash';
						document.body.append(frame);
						setTimeout(() => resolve({ pending: true }), 5000);
					}),
				// and a link a frame of this one clicks, aimed at its parent
				linkAimed: () => aimedFrom('link'),
				// a link of this document aimed by name at a frame of it still on
				// its initial about:blank: where the frame is after it (the
				// browser's own navigation, with the parts)
				blankLink: () =>
					aimedAt('blank-link', (name) => {
						const link = document.createElement('a');
						link.target = name;
						link.href = 'deferred-refusals-landed.html?blank';
						document.body.append(link);
						link.click();
						link.remove();
					}),
				// the same, a form's submit(), which throws without the part
				blankSubmit: () =>
					aimedAt('blank-submit', (name) => {
						const form = document.createElement('form');
						form.target = name;
						form.action = 'deferred-refusals-landed.html';
						const input = document.createElement('input');
						input.name = 'z';
						input.value = '3';
						form.append(input);
						document.body.append(form);
						try {
							form.submit();
							return null;
						} catch (error) {
							return String(error && error.message);
						} finally {
							form.remove();
						}
					}),
				// an image in a new frame's about:blank, which no service worker
				// controls: its load is a copy (src/inject/dom/uncontrolledCopies.ts)
				blankCopy: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						document.body.append(frame);
						const blank = frame.contentDocument;
						const image = blank.createElement('img');
						image.onload = () => resolve({ loaded: true });
						image.onerror = () => resolve({ loaded: false });
						try {
							image.src = 'blank-sprite.svg';
							blank.body.append(image);
						} catch (error) {
							resolve({ threw: String(error && error.message) });
						}
						setTimeout(() => resolve({ pending: true }), 5000);
					}),
				// an XML document a frame loads through the XML shell (its load
				// is a part, src/inject/dom/instructions.ts loadXML): whether
				// its root's children landed
				xmlLoad: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						frame.onload = () => {
							try {
								const root = frame.contentDocument.documentElement;
								resolve({
									root: root.localName,
									landed: !!root.querySelector('symbol rect'),
								});
							} catch (error) {
								resolve({ threw: String(error && error.message) });
							}
						};
						frame.src = 'blank-sprite.svg';
						document.body.append(frame);
						setTimeout(() => resolve({ pending: true }), 5000);
					}),
				// a navigation of another window of the page's (a frame of its
				// own, by `w.location = url`): where the frame is after it
				// a call of no function through the access API: V8's message names
				// the page's expression (a part words it, src/inject/accessFailures.ts)
				// a worker's construction past its checks (src/inject/workerStart.ts)
				worker: () =>
					outcome(() => {
						const worker = new Worker('boom.js');
						worker.terminate();
						return worker;
					}),
				// a protocol handler's registration, accepted silently after the
				// browser's checks (src/inject/dom/protocolHandlers.ts)
				protocolHandler: () =>
					outcome(() =>
						navigator.registerProtocolHandler(
							'web+refusals',
							`${location.origin}/?%s`,
						),
					),
				// a WebSocket's and a WebSocketStream's construction
				// (src/inject/bareClient.ts socketStandIns): a URL with a fragment,
				// which the browser's own constructor refuses
				webSocket: () =>
					outcome(() => new WebSocket('wss://socket.invalid/#x')),
				webSocketStream: () =>
					outcome(() => new WebSocketStream('wss://socket.invalid/#x')),
				// fetchLater (src/inject/dom/fetchLater.ts): a URL it cannot defer
				fetchLater: () => outcome(() => fetchLater('data:,x')),
				// the Cache API's calls past their hooks' checks
				// (src/inject/cacheCalls.ts): a match in this origin's caches,
				// and an add(), which fetches and keeps what came back
				cacheMatch: () =>
					outcome(() => caches.match('deferred-refusals-landed.html')),
				cacheAdd: () =>
					outcome(() =>
						caches
							.open('deferred-refusals')
							.then((cache) => cache.add('deferred-refusals-landed.html')),
					),
				// what a tainted source is refused with, and the walk of a message
				// for a tainted ImageBitmap (src/inject/dom/taintRefusals.ts): an
				// image of another origin (the fixture's other host) as a
				// VideoFrame, a WebGL texture, in an OffscreenCanvas exported, and
				// as an ImageBitmap cloned
				taintVideoFrame: () =>
					outcome(async () => {
						const element = await crossImage();
						new VideoFrame(element, { timestamp: 0 }).close();
					}),
				taintTexture: () =>
					outcome(async () => {
						const element = await crossImage();
						const gl = document.createElement('canvas').getContext('webgl');
						if (!gl) throw new Error('no webgl');
						gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
						gl.texImage2D(
							gl.TEXTURE_2D,
							0,
							gl.RGBA,
							gl.RGBA,
							gl.UNSIGNED_BYTE,
							element,
						);
					}),
				taintExport: () =>
					outcome(async () => {
						const element = await crossImage();
						const canvas = new OffscreenCanvas(4, 4);
						canvas.getContext('2d').drawImage(element, 0, 0);
						await canvas.convertToBlob();
					}),
				taintClone: () =>
					outcome(async () => {
						const bitmap = await createImageBitmap(await crossImage());
						structuredClone({ bitmap });
					}),
				// Origin.from() of this window (src/inject/originFrom.ts)
				originFrom: () => outcome(() => Origin.from(window)),
				// an array method called with a window as its receiver
				// (src/inject/windowArrays.ts): its first child, or none
				windowArray: () => outcome(() => Array.prototype.at.call(window, 0)),
				// the usage walk behind navigator.storage.estimate()
				// (src/inject/storageUsage.ts)
				estimate: () => outcome(() => navigator.storage.estimate()),
				// markup the browser parses, rewritten first by a deferred part
				// (src/inject/dom/markupSinks.ts)
				execCommand: () =>
					outcome(() => document.execCommand('insertHTML', false, '<b>x</b>')),
				contextualFragment: () =>
					outcome(() =>
						document.createRange().createContextualFragment('<b>x</b>'),
					),
				// the sanitizing and parsing members on an element of a frame on
				// its initial about:blank, which its creator's bundle hooks
				// (src/inject/dom/markupSinks.ts): what each did, and whether
				// anything was parsed into the element
				blankSetHTML: () => {
					const frame = document.createElement('iframe');
					document.body.append(frame);
					const element = frame.contentDocument.createElement('div');
					frame.contentDocument.body.append(element);
					const out = {};
					for (const name of ['setHTML', 'setHTMLUnsafe'])
						try {
							element[name]('<b>x</b><img src="blank-sprite.svg">');
							out[name] = { returned: true };
						} catch (error) {
							out[name] = { threw: String(error && error.message) };
						}
					try {
						out.getHTML = { returned: typeof element.getHTML() };
					} catch (error) {
						out.getHTML = { threw: String(error && error.message) };
					}
					out.parsed = frame.contentDocument.querySelectorAll('b, img').length;
					return out;
				},
				// an <object>'s HTML document (objectDocument)
				objectDocument: () => objectDocument(false),
				// the same with a type, which shows an empty document of its own
				// without a URL
				typedObjectDocument: () => objectDocument(true),
				// window.open(), routed by a deferred part
				// (src/inject/dom/windowOpen.ts)
				open: () => outcome(() => window.open('', '_blank')),
				notFunction: () =>
					outcome(() => {
						const o = {};
						const k = 'f';
						return o[k]();
					}),
				navigateOther: () =>
					new Promise((resolve) => {
						const frame = document.createElement('iframe');
						frame.onload = async () => {
							frame.onload = null;
							const result = await outcome(() => {
								frame.contentWindow.location =
									'deferred-refusals-landed.html?moved';
							});
							setTimeout(() => {
								let at;
								try {
									at = frame.contentWindow.location.search;
								} catch (error) {
									at = String(error && error.message);
								}
								resolve({ ...result, at });
							}, 2000);
						};
						frame.src = 'deferred-refusals-landed.html';
						document.body.append(frame);
					}),
				// a same-origin download link's click: the copy is saved after
				// the click went through the page (the suite counts downloads)
				download: () =>
					outcome(() => {
						const link = document.createElement('a');
						link.href = 'deferred-refusals.html';
						link.download = 'refusals.html';
						document.body.append(link);
						link.click();
					}),
			};
			(async () => {
				const out = {};
				for (const name of location.hash.slice(1).split(','))
					out[name] = await CALLS[name]();
				parent.postMessage(
					{ out, reached: window.__nativeReached ?? null },
					'*',
				);
			})();
		</script>
	</body>
</html>
