<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>access tamper frame</title>
	</head>
	<body>
		<script>
			// A page that replaces a method of the collections the inject
			// keeps windows in (test/suites/access-tamper.mjs), then reads a
			// frame of another site: it must be refused as natively. `?case=`
			// names the method it replaces.
			(function () {
				var which = new URLSearchParams(location.search).get('case');
				var frame = document.createElement('iframe');
				frame.src =
					'http://localhost:' + location.port + '/pages/first-rewrite.html';
				frame.onload = function () {
					setTimeout(function () {
						if (which === 'weakSetHas')
							WeakSet.prototype.has = function () {
								return true;
							};
						// (the calls a read below made of the page's replacement:
						// the page made no WeakMap, so each was the inject's own,
						// with its map; once one handed the page the map of every
						// hooked function's native, fetch's among them)
						var reading = false;
						var calls = 0;
						if (which === 'weakMapGet') {
							var get = WeakMap.prototype.get;
							// what the map holds for a key is the key
							WeakMap.prototype.get = function (key) {
								if (reading) calls++;
								return get.call(this, key) === undefined ? undefined : key;
							};
						}
						var report = { case: which, done: false };
						var read = function (name, what) {
							note(name, function () {
								reading = true;
								try {
									return what();
								} finally {
									reading = false;
								}
							});
						};
						var note = function (name, read) {
							try {
								report[name] = String(read());
							} catch (error) {
								report[name] = 'threw ' + error.name;
							}
						};
						note('indexDocument', function () {
							var i = 0;
							return frames[i].document.title;
						});
						note('contentDocument', function () {
							return frame.contentDocument === null
								? 'null'
								: frame.contentDocument.title;
						});
						note('contentWindowDocument', function () {
							return frame.contentWindow.document.title;
						});
						note('childLocation', function () {
							var i = 0;
							return frames[i].location.href;
						});
						// The frame's window as a page holds it in its own
						// objects, read back by a computed key: each read is the
						// access helpers' (their short ways for plain objects,
						// arrays and arguments), and each must be refused as
						// natively. (The window an iterator of `window` hands
						// out is the frame's own, a way past the hooks that is
						// not this suite's: it is read here only through the
						// helpers.)
						var raw = null;
						try {
							raw = Array.prototype.values.call(window).next().value;
						} catch (error) {
							// none
						}
						var k = 'w' + which.length;
						var i = 0;
						var o = {};
						o[k] = raw;
						note('objectKey', function () {
							return o[k].document.title;
						});
						note('objectKeyAgain', function () {
							var title = '';
							for (var j = 0; j < 3; j++) title += o[k].document.title;
							return title;
						});
						note('arrayIndex', function () {
							var list = [o, raw];
							return list[i + 1].document.title;
						});
						note('argumentsIndex', function () {
							return (function () {
								return arguments[i].document.title;
							})(raw);
						});
						note('nested', function () {
							var n = 'inner';
							var box = { inner: o };
							return box[n][k].document.title;
						});
						note('compound', function () {
							var target = {};
							target[k] = null;
							target[k] ||= raw;
							return target[k].document.title;
						});
						note('compoundAnswer', function () {
							var target = {};
							target[k] = raw;
							return (target[k] ||= 1).document.title;
						});
						note('forIn', function () {
							var title = '';
							for (var key in o) title += o[key].document.title;
							return title;
						});
						note('method', function () {
							o[k].addEventListener('message', function () {});
							return 'listening';
						});
						note('written', function () {
							var name = 'stomp' + which.length;
							raw[name] = 1;
							return 'wrote';
						});
						read('fetchSource', function () {
							return Function.prototype.toString.call(fetch);
						});
						read('appendSource', function () {
							return String(Element.prototype.append);
						});
						note('readCalls', function () {
							return calls;
						});
						report.done = true;
						window.__tamper = report;
					}, 300);
				};
				document.body.appendChild(frame);
			})();
		</script>
	</body>
</html>
