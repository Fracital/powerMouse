<!doctype html>
<title>SAMESITE</title>
<script>
	// loaded from the fixture's other host name (localhost): the fixture's
	// 127.0.0.1 origin is a different site, whose cookies the proxy must send
	// by their SameSite rules
	window.__ss = {};
	const target = location.origin.replace('localhost', '127.0.0.1');
	const frame = document.createElement('iframe');
	frame.src = target + '/echo-headers';
	document.documentElement.append(frame);
	// a credentialed subresource (what an <img> or <script> is to the
	// browser: credentials include) carries the cookies the SameSite rules
	// allow across sites, None only; a default fetch() (credentials
	// same-origin) carries none at all to another site
	const cookie = (init) =>
		fetch(target + '/echo-headers', init)
			.then((r) => r.json())
			.then((h) => h.cookie || '');
	Promise.all([cookie({ credentials: 'include' }), cookie()])
		.then(([subresource, plain]) => {
			__ss.subresource = subresource;
			__ss.plain = plain;
		})
		.catch((e) => {
			__ss.error = String(e);
		})
		.finally(() => {
			__ss.done = true;
		});
</script>
