<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<title>STANDALONE XHTML</title>
		<link rel="stylesheet" href="/pages/imp.css" />
	</head>
	<body>
		<a id="link" href="/pages/hist-1.html">link</a>
		<img id="img" src="/pages/sprite.svg?xhtmldoc" alt="" />
		<script>
			document.documentElement.setAttribute(
				'data-top',
				top === window ? 'self' : 'OTHER',
			);
			document.documentElement.setAttribute('data-href', location.href);
			document.documentElement.setAttribute(
				'data-link',
				document.getElementById('link').href,
			);
			document.documentElement.setAttribute(
				'data-img',
				document.getElementById('img').src,
			);
		</script>
	</body>
</html>
