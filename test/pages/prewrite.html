<!doctype html>
<title>PREWRITE</title>
<style>
	.pw {
		background: url(prewrite-missing.png) no-repeat;
	}
</style>
<script>
	window.__pw = window.__pw || { order: [] };
	__pw.order.push('a');
	__pw.currentA = document.currentScript.textContent.includes("push('a')");
	__pw.topType = typeof top;
	function namedA() {
		return location.pathname;
	}
	__pw.fnSource = namedA.toString();
	__pw.path = namedA();
</script>
<script type="module">
	window.__pw.order.push('module');
	function inModule() {
		return location.pathname;
	}
	window.__pw.moduleSource = inModule.toString();
	// the markup's handlers, each run once (their places read in __pw.at)
	document.getElementById('handler-a').click();
	for (const button of document.querySelectorAll('.handler')) {
		button.dispatchEvent(new MouseEvent('mouseover'));
		button.click();
	}
	window.__pw.done = true;
</script>
<script>
	'use strict';
	__pw.order.push('strict');
	__pw.strict = (function () {
		return this === undefined;
	})();
</script>
<script>
	__pw.order.push('c');
	__pw.closing = '<\/script>'.length;
</script>
<script type="text/template">
	this is not code: location
</script>
<script>
	// a page that reads a script of its markup back and runs a copy of it
	// (CNN's loader does): the copy is the page's text again
	var copy = document.createElement('script');
	copy.text = document.scripts[0].text;
	document.head.appendChild(copy);
	__pw.copyText = copy.text === document.scripts[0].text;
	__pw.styleText = document.querySelector('style').textContent.trim();
</script>
<script>
	// where a handler's frame is: its line and column, as V8 names them
	function where(error) {
		var frame = String(error.stack).split('\n')[1] || '';
		var found = /:(\d+):(\d+)\)?$/.exec(frame);
		return found ? found[1] + ':' + found[2] : frame;
	}
	__pw.at = [];
</script>
<!-- handlers of the markup: the worker's rewrites, each placed where its tag ends -->
<button
	id="handler-a"
	onclick="
		__pw.handlerPath = location.pathname;
		function inHandler() {
			return 'h';
		}
		__pw.handlerSource = inHandler.toString();
	"
>
	a
</button>
<button class="handler" onclick="__pw.at.push(where(new Error()))">b</button>
<button
	class="handler"
	onmouseover="__pw.at.push(where(new Error()))"
	onclick="__pw.at.push(where(new Error()))"
>
	c
</button>
<button class="handler" onClick='__pw.at.push("single", where(new Error()))'>
	d
</button>
<button
	class="handler"
	onclick="true &amp;&amp; __pw.at.push('reference', where(new Error()))"
>
	e
</button>
<table>
	<tbody>
		<tr>
			<td>
				<script>
					// a function, so the worker's rewrite carries its holder statement
					function inCell() {
						return 'cell';
					}
					__pw.order.push(inCell());
				</script>
			</td>
		</tr>
	</tbody>
</table>
<script>
	// the cell's script parsed again in a table section's context (a tbody's
	// innerHTML keeps its row and cell), then run as a copy: its text is the
	// markup's, so the copy is the worker's rewrite; a copy of other text is
	// rewritten in the page
	var section = document.createElement('tbody');
	section.innerHTML =
		'<tr><td>' + document.querySelector('td script').outerHTML + '</td></tr>';
	var parsed = section.querySelector('script');
	__pw.tableParsed = !!parsed && parsed.parentNode.nodeName === 'TD';
	var run = document.createElement('script');
	run.text = parsed.text;
	document.body.appendChild(run);
	var other = document.createElement('script');
	other.text = parsed.text + '\n__pw.order.push("other");';
	document.body.appendChild(other);
</script>
