<!doctype html>
<title>ADV CHILD</title>
<body></body>
<script>
	// A child frame of an adv-* page: reports what it sees of its ancestry.
	// Same-origin children call into the parent; the cross-site copy (served
	// as localhost) posts, since a real browser would not let it call.
	const name = new URLSearchParams(location.search).get('name') || 'child';
	const who = (x) => {
		try {
			if (x === window) return 'self';
			if (x === parent) return 'parent';
			if (x === null) return 'null';
			if (x && x.window === x) return 'OTHER-WINDOW';
			return String(x);
		} catch (error) {
			return 'OTHER-WINDOW(' + error.name + ')';
		}
	};
	const safe = (fn) => {
		try {
			return fn();
		} catch (error) {
			return 'threw ' + error.name;
		}
	};
	// ?nav=<route>: run one javascript:-URL route in this frame, so a route
	// that navigates the window away takes only this frame with it. Nested
	// frames created here report two levels up.
	const nav = new URLSearchParams(location.search).get('nav');
	if (nav !== null) {
		const R = (value, error) => parent.__advRecord(nav, value, error);
		const payload =
			'parent.__advChild(' +
			JSON.stringify(nav) +
			', top === parent ? "parent" : top === window ? "self" : "OTHER-WINDOW", location.href)';
		// for a frame created inside this frame: its top should be our parent
		const nested =
			'parent.parent.__advChild(' +
			JSON.stringify(nav) +
			', top === parent.parent ? "parent" : top === window ? "self" : "OTHER-WINDOW", location.href)';
		// for a popup this frame opens: it has no parent, its opener is this
		// frame, and it is its own top
		const popup =
			'opener.parent.__advChild(' +
			JSON.stringify(nav + ' [in popup]') +
			', top === window ? "self" : "OTHER-WINDOW", location.href); void setTimeout(function () { close(); }, 1500)';
		// for code that runs in the parent page itself
		const inParent =
			'__advChild(' +
			JSON.stringify(nav) +
			', top === window ? "self" : "OTHER-WINDOW", location.href)';
		const popupWho = (w) => {
			try {
				if (w === null) return 'null';
				if (w === window) return 'self';
				if (w === parent) return 'parent';
				return w.window === w &&
					w.opener === window &&
					w.top === w &&
					w.parent === w
					? 'popup'
					: 'OTHER-WINDOW';
			} catch (error) {
				return 'OTHER-WINDOW(' + error.name + ')';
			}
		};
		// what the popup's own evaluators answer: its URL, its base, its
		// opener and its top, read by code that runs in the popup
		const popupRealm = (w) => {
			const read = (run) => {
				try {
					return run(
						'[location.href, document.baseURI, origin, top === self ? "top" : "framed", opener === null ? "no opener" : opener.location.href, typeof parent.__advChild]',
					);
				} catch (error) {
					return 'threw ' + error.name;
				}
			};
			if (!w) return 'no window';
			return {
				eval: read((code) => w.eval(code)),
				Function: read((code) => new w.Function('return ' + code)()),
				setTimeout: typeof w.setTimeout,
				sameEval: w.eval === eval ? "TELL:the opener's eval" : 'its own',
			};
		};
		const frame = (fn) => {
			const f = document.createElement('iframe');
			fn(f);
			document.body.append(f);
		};
		const ROUTES = {
			'iframe.src = javascript:': () =>
				frame((f) => (f.src = 'javascript:' + nested)),
			'iframe.setAttribute(src, javascript:)': () =>
				frame((f) => f.setAttribute('src', 'javascript:' + nested)),
			'about:blank location = javascript:': () => {
				const f = document.createElement('iframe');
				document.body.append(f);
				f.contentWindow.location = 'javascript:' + nested;
			},
			'object data=javascript:': () => {
				const o = document.createElement('object');
				o.data = 'javascript:' + nested;
				document.body.append(o);
			},
			'embed src=javascript:': () => {
				const e = document.createElement('embed');
				e.src = 'javascript:' + nested;
				document.body.append(e);
			},
			'a href=javascript: click': (p) => {
				const a = document.createElement('a');
				a.href = 'javascript:' + p;
				document.body.append(a);
				a.click();
			},
			'a setAttribute(href, javascript:) click': (p) => {
				const a = document.createElement('a');
				a.setAttribute('href', 'javascript:' + p);
				document.body.append(a);
				a.click();
			},
			'a setAttributeNode(href, javascript:) click': (p) => {
				const a = document.createElement('a');
				const attr = document.createAttribute('href');
				attr.value = 'javascript:' + p;
				a.setAttributeNode(attr);
				document.body.append(a);
				a.click();
			},
			'area href=javascript: click': (p) => {
				const m = document.createElement('map');
				const a = document.createElement('area');
				a.href = 'javascript:' + p;
				m.append(a);
				document.body.append(m);
				a.click();
			},
			'form action=javascript: submit': (p) => {
				const f = document.createElement('form');
				f.action = 'javascript:' + p;
				document.body.append(f);
				f.submit();
			},
			'form button formaction=javascript:': (p) => {
				const f = document.createElement('form');
				const b = document.createElement('button');
				b.setAttribute('formaction', 'javascript:' + p);
				f.append(b);
				document.body.append(f);
				b.click();
			},
			'location.assign(javascript:)': (p) => location.assign('javascript:' + p),
			'location.replace(javascript:)': (p) =>
				location.replace('javascript:' + p),
			'location.href = javascript:': (p) => {
				location.href = 'javascript:' + p;
			},
			'location = javascript:': (p) => {
				location = 'javascript:' + p;
			},
			'window.location = javascript:': (p) => {
				window.location = 'javascript:' + p;
			},
			'document.location = javascript:': (p) => {
				document.location = 'javascript:' + p;
			},
			'Reflect.set(window, location, javascript:)': (p) =>
				Reflect.set(window, 'location', 'javascript:' + p),
			'Reflect.set(document, location, javascript:)': (p) =>
				Reflect.set(document, 'location', 'javascript:' + p),
			'Object.assign(window, {location})': (p) =>
				Object.assign(window, { location: 'javascript:' + p }),
			'Object.assign(document, {location})': (p) =>
				Object.assign(document, { location: 'javascript:' + p }),
			'gOPD(window, location).set.call': (p) =>
				Object.getOwnPropertyDescriptor(window, 'location').set.call(
					window,
					'javascript:' + p,
				),
			'history.pushState then javascript:': (p) => {
				const a = document.createElement('a');
				a.href = 'javascript:' + p;
				document.body.append(a);
				history.pushState(null, '', '#adv');
				a.click();
			},
			// a popup: the URL's code runs in the new window, whose opener is
			// this frame, and the window comes back to the caller. It is
			// another window by right, so it is named 'popup' when it is a
			// top-level window this frame opened and OTHER-WINDOW otherwise
			'window.open(javascript:)': () => {
				const w = window.open('javascript:' + popup);
				parent.__advRecord(nav + ' [returned]', popupWho(w));
				parent.__advRecord(nav + ' [returned realm]', popupRealm(w));
			},
			'window.open(javascript:, _blank)': () => {
				const w = window.open('javascript:' + popup, '_blank');
				parent.__advRecord(nav + ' [returned]', popupWho(w));
			},
			'window.open() then location = javascript:': () => {
				const w = window.open();
				parent.__advRecord(nav + ' [returned]', popupWho(w));
				w.location = 'javascript:' + popup;
			},
			'window.open(about:blank) then location.href = javascript:': () => {
				const w = window.open('about:blank');
				w.location.href = 'javascript:' + popup;
			},
			'window.open() then eval': () => {
				const w = window.open();
				w.eval(popup);
			},
			'document.open(javascript:, _blank, features)': () => {
				const w = document.open('javascript:' + popup, '_blank', '');
				parent.__advRecord(nav + ' [returned]', popupWho(w));
			},
			// a javascript: URL aimed at another window runs there: the parent
			// (this frame's top), or a frame of this frame by name
			'window.open(javascript:, _parent)': () =>
				window.open('javascript:' + inParent, '_parent'),
			'window.open(javascript:, _top)': () =>
				window.open('javascript:' + inParent, '_top'),
			'a target=_parent href=javascript: click': () => {
				const a = document.createElement('a');
				a.href = 'javascript:' + inParent;
				a.target = '_parent';
				document.body.append(a);
				a.click();
			},
			'a target=_top href=javascript: click': () => {
				const a = document.createElement('a');
				a.href = 'javascript:' + inParent;
				a.target = '_top';
				document.body.append(a);
				a.click();
			},
			'form target=_parent action=javascript: submit': () => {
				const f = document.createElement('form');
				f.action = 'javascript:' + inParent;
				f.target = '_parent';
				document.body.append(f);
				f.submit();
			},
			'form target=_top action=javascript: requestSubmit': () => {
				const f = document.createElement('form');
				f.action = 'javascript:' + inParent;
				f.target = '_top';
				document.body.append(f);
				f.requestSubmit();
			},
			'button formtarget=_parent formaction=javascript: click': () => {
				const f = document.createElement('form');
				const b = document.createElement('button');
				b.setAttribute('formaction', 'javascript:' + inParent);
				b.setAttribute('formtarget', '_parent');
				f.append(b);
				document.body.append(f);
				b.click();
			},
			'base target=_parent, a href=javascript: click': () => {
				const base = document.createElement('base');
				base.target = '_parent';
				document.head.append(base);
				const a = document.createElement('a');
				a.href = 'javascript:' + inParent;
				document.body.append(a);
				a.click();
			},
			// a window a link opens by its target, which no call of the page's
			// made: the URL's code runs in it, and this frame is its opener
			'a target=new window href=javascript: click': () => {
				const a = document.createElement('a');
				a.href = 'javascript:' + popup;
				a.target = 'advlinkpopup';
				document.body.append(a);
				a.click();
			},
			'parent.location = javascript:': () => {
				parent.location = 'javascript:' + inParent;
			},
			'top.location.href = javascript:': () => {
				top.location.href = 'javascript:' + inParent;
			},
			'window.open(javascript:, named frame)': () =>
				frame((f) => {
					f.name = 'advnamed';
					setTimeout(() => window.open('javascript:' + nested, 'advnamed'));
				}),
			'a target=named frame href=javascript: click': () =>
				frame((f) => {
					f.name = 'advnamed';
					setTimeout(() => {
						const a = document.createElement('a');
						a.href = 'javascript:' + nested;
						a.target = 'advnamed';
						document.body.append(a);
						a.click();
					});
				}),
			'form target=named frame action=javascript: submit': () =>
				frame((f) => {
					f.name = 'advnamed';
					setTimeout(() => {
						const form = document.createElement('form');
						form.action = 'javascript:' + nested;
						form.target = 'advnamed';
						document.body.append(form);
						form.submit();
					});
				}),
			'iframe contentWindow.location.href = javascript:': () => {
				const f = document.createElement('iframe');
				document.body.append(f);
				f.contentWindow.location.href = 'javascript:' + nested;
			},
			'iframe contentWindow.location.assign(javascript:)': () => {
				const f = document.createElement('iframe');
				document.body.append(f);
				f.contentWindow.location.assign('javascript:' + nested);
			},
			'iframe contentWindow.location.replace(javascript:)': () => {
				const f = document.createElement('iframe');
				document.body.append(f);
				f.contentWindow.location.replace('javascript:' + nested);
			},
			'frames[0].location = javascript:': () => {
				const f = document.createElement('iframe');
				document.body.append(f);
				frames[0].location = 'javascript:' + nested;
			},
			'iframe src=javascript: in innerHTML': () => {
				const d = document.createElement('div');
				document.body.append(d);
				d.innerHTML =
					'<iframe src="javascript:' +
					nested.replace(/"/g, '&quot;') +
					'"></iframe>';
			},
			'iframe loaded then src = javascript:': () => {
				const f = document.createElement('iframe');
				f.addEventListener(
					'load',
					() => {
						f.src = 'javascript:' + nested;
					},
					{ once: true },
				);
				document.body.append(f);
			},
			// the scheme as the URL parser reads it: any case, tabs and
			// newlines dropped from anywhere, leading spaces and controls
			'location = JaVaScRiPt:': (p) => {
				location = 'JaVaScRiPt:' + p;
			},
			'location = java\\tscript:': (p) => {
				location = 'java\tscr\nipt:' + p;
			},
			'location = leading controls javascript:': (p) => {
				location = ' \x01\x1f javascript:' + p;
			},
			'a href=jav&Tab;ascript: in innerHTML click': (p) => {
				const d = document.createElement('div');
				document.body.append(d);
				d.innerHTML =
					'<a href="jav&Tab;ascript:' + p.replace(/"/g, '&quot;') + '">x</a>';
				d.firstChild.click();
			},
			'a href= leading space javascript: click': (p) => {
				const a = document.createElement('a');
				a.setAttribute('href', ' \n javascript:' + p);
				document.body.append(a);
				a.click();
			},
			'svg a href=javascript: click': (p) => {
				const d = document.createElement('div');
				document.body.append(d);
				d.innerHTML =
					'<svg><a href="javascript:' +
					p.replace(/"/g, '&quot;') +
					'"><text y="10">x</text></a></svg>';
				d.querySelector('a').dispatchEvent(
					new MouseEvent('click', { bubbles: true, cancelable: true }),
				);
			},
			'svg a xlink:href=javascript: click': (p) => {
				const d = document.createElement('div');
				document.body.append(d);
				d.innerHTML =
					'<svg><a xlink:href="javascript:' +
					p.replace(/"/g, '&quot;') +
					'"><text y="10">x</text></a></svg>';
				d.querySelector('a').dispatchEvent(
					new MouseEvent('click', { bubbles: true, cancelable: true }),
				);
			},
			'svg a href.baseVal = javascript: click': (p) => {
				const d = document.createElement('div');
				document.body.append(d);
				d.innerHTML = '<svg><a><text y="10">x</text></a></svg>';
				const a = d.querySelector('a');
				a.href.baseVal = 'javascript:' + p;
				a.dispatchEvent(
					new MouseEvent('click', { bubbles: true, cancelable: true }),
				);
			},
			'svg a set href to=javascript: click': (p) => {
				const d = document.createElement('div');
				document.body.append(d);
				d.innerHTML =
					'<svg><a href="#"><set attributeName="href" to="javascript:' +
					p.replace(/"/g, '&quot;') +
					'"/><text y="10">x</text></a></svg>';
				setTimeout(
					() =>
						d
							.querySelector('a')
							.dispatchEvent(
								new MouseEvent('click', { bubbles: true, cancelable: true }),
							),
					100,
				);
			},
			'input type=submit formaction=javascript:': (p) => {
				const f = document.createElement('form');
				const b = document.createElement('input');
				b.type = 'submit';
				b.formAction = 'javascript:' + p;
				f.append(b);
				document.body.append(f);
				b.click();
			},
			'form.requestSubmit(button formaction=javascript:)': (p) => {
				const f = document.createElement('form');
				const b = document.createElement('button');
				b.formAction = 'javascript:' + p;
				f.append(b);
				document.body.append(f);
				f.requestSubmit(b);
			},
			'navigation.navigate(javascript:)': (p) => {
				navigation.navigate('javascript:' + p);
			},
			'location.href = javascript: via Reflect.set(location)': (p) => {
				Reflect.set(location, 'href', 'javascript:' + p);
			},
			'location.assign.call(location, javascript:)': (p) => {
				location.assign.call(location, 'javascript:' + p);
			},
			'document.location.assign(javascript:)': (p) => {
				document.location.assign('javascript:' + p);
			},
			"window['loc' + 'ation'] = javascript:": (p) => {
				window['loc' + 'ation'] = 'javascript:' + p;
			},
			'self.location = javascript:': (p) => {
				self.location = 'javascript:' + p;
			},
			'window.open(javascript:, _self)': (p) =>
				window.open('javascript:' + p, '_self'),
			'meta refresh javascript:': (p) => {
				const m = document.createElement('meta');
				m.httpEquiv = 'refresh';
				m.content = '0;url=javascript:' + p;
				document.head.append(m);
			},
		};
		R('did-not-run');
		try {
			ROUTES[nav](payload);
		} catch (error) {
			R(undefined, error);
		}
	} else {
		const report = {
			__adv: name,
			top: who(top),
			parentIsSelf: parent === window,
			topLocation: safe(() => top.location.href),
			parentLocation: safe(() => parent.location.href),
			topTitle: safe(() => top.document.title),
			href: location.href,
			origin: location.origin,
			referrer: document.referrer,
			ancestors: safe(() => Array.from(location.ancestorOrigins || [])),
			frameElement: safe(() => (frameElement ? 'ELEMENT' : 'null')),
			windowName: window.name,
			topFramesLength: safe(() => top.frames.length),
		};
		if (new URLSearchParams(location.search).has('post')) {
			parent.postMessage(report, '*');
		} else if (parent !== window) {
			parent.__advRecord(name, report);
		}
		// else a popup (adv-frames' window.open probe): natively the page
		// closes it before it loads; a host that takes popups as tabs (the
		// demo) returns null instead, so it loads top-level, with no parent
		// page to report to
		// a grandchild that posts to `top`: spoofed, that is our parent page;
		// real, that is the host
		if (new URLSearchParams(location.search).has('nested')) {
			const f = document.createElement('iframe');
			f.srcdoc =
				'<script>top.postMessage({__adv: "grandchild top.postMessage", top: top === parent.parent ? "grandparent" : top === parent ? "parent" : "OTHER-WINDOW", href: location.href}, "*"); parent.parent.__advRecord && parent.parent.__advRecord("grandchild direct", {top: top === parent.parent ? "grandparent" : "OTHER-WINDOW", href: location.href, ancestors: Array.from(location.ancestorOrigins || [])});<\/script>';
			document.body.append(f);
		}
		if (new URLSearchParams(location.search).has('storage')) {
			localStorage.setItem('adv-storage-' + Date.now(), 'child');
		}
	}
</script>
