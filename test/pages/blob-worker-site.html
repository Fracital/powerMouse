<!doctype html>
<title>BLOB WORKER SITE</title>
<script>
	// A blob: worker's requests, judged as the page that made it: an
	// importScripts and a fetch to another site (`?cross=<origin>`), and a
	// fetch to the page's own origin, all with the default credentials
	// (same-origin), and one to its own origin with `include`. The round
	// runs once into __blobSite, and again into __blobAgain on
	// `__blobWorker.postMessage('again')`. Each request's headers are echoed
	// or kept by key (`?k=<key>`). With `?setup` the page only sets its
	// cookie (the .headers.json sidecar: SameSite=Strict) and stops.
	const query = new URLSearchParams(location.search);
	if (!query.has('setup')) {
		const key = query.get('k');
		const cross = query.get('cross');
		const source = `
			const cross = ${JSON.stringify(cross)};
			const own = ${JSON.stringify(location.origin)};
			const pause = () => new Promise((resolve) => setTimeout(resolve, 500));
			// a request, retried until it is answered: a service worker that
			// is restarting lets requests through unanswered for a moment
			let retries = 0;
			const get = async (url, init) => {
				for (let i = 0; ; i++, retries++) {
					try {
						const response = await fetch(url, init);
						if (response.ok || i === 60) return response.json();
					} catch (error) {
						if (i === 60) throw error;
					}
					await pause();
				}
			};
			const load = async (url) => {
				for (let i = 0; ; i++) {
					try {
						return importScripts(url);
					} catch (error) {
						if (i === 60) throw error;
					}
					await pause();
				}
			};
			// the requests of one round, keyed by the round's tag
			const round = async (tag) => {
				const [crossSite, same, include] = await Promise.all([
					get(cross + '/echo-headers?k=${key}-' + tag + '-cross'),
					get(own + '/echo-headers?k=${key}-' + tag + '-same'),
					get(own + '/echo-headers?k=${key}-' + tag + '-include', { credentials: 'include' }),
				]);
				await load(cross + '/echo-headers?js&k=${key}-' + tag + '-import');
				return { tag, cross: crossSite, same, include, retries };
			};
			const report = (tag, promise) =>
				promise.then(postMessage, (error) => postMessage({ tag, error: String(error) }));
			onmessage = (event) => {
				if (event.data === 'again') report('again', round('again'));
			};
			report('first', Promise.resolve().then(() => round('first')));
		`;
		const url = URL.createObjectURL(
			new Blob([source], { type: 'text/javascript' }),
		);
		const worker = new Worker(url);
		window.__blobWorker = worker;
		worker.onmessage = (event) =>
			(window[event.data.tag === 'again' ? '__blobAgain' : '__blobSite'] =
				event.data);
		worker.onerror = (event) =>
			(window.__blobSite = { error: event.message || 'worker error' });
	}
</script>
