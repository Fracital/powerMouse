<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>access tamper</title>
	</head>
	<body>
		<script>
			// A page that replaces a native the access helpers could have
			// called (test/suites/access-tamper.mjs): what it then reads of
			// its location, its top and its eval must be what it reads
			// natively. `?case=` names the native it replaces.
			(function () {
				var which = new URLSearchParams(location.search).get('case');
				var report = { case: which, done: false };
				var note = function (name, read) {
					try {
						report[name] = String(read());
					} catch (error) {
						report[name] = 'threw ' + error.name;
					}
				};
				// an option that carries a script, for the indexed setter of a
				// select: the script must run as the page's (its location is
				// the page's)
				var landed = function (index) {
					var select = document.createElement('select');
					document.body.appendChild(select);
					var option = document.createElement('option');
					var script = document.createElement('script');
					script.textContent = 'window.__landed = location.href;';
					option.appendChild(script);
					window.__landed = 'did not run';
					select[index] = option;
					return window.__landed;
				};
				if (which === 'includes')
					Array.prototype.includes = function () {
						return false;
					};
				// methods of the strings and arrays the helpers make or are
				// handed, each answering what it never would (put back once
				// the page read everything: the driver's own code reads the
				// report with them)
				var restore = [];
				var liars = function (proto, answers) {
					Object.keys(answers).forEach(function (name) {
						var answer = answers[name];
						restore[restore.length] = [proto, name, proto[name]];
						proto[name] = function () {
							return typeof answer === 'function' ? answer() : answer;
						};
					});
				};
				if (which === 'stringMethods')
					liars(String.prototype, {
						toLowerCase: 'text/plain',
						toUpperCase: 'TEXT/PLAIN',
						trim: '',
						slice: '',
						substring: '',
						replace: '',
						startsWith: false,
						endsWith: false,
						includes: false,
						indexOf: -1,
						lastIndexOf: -1,
						charCodeAt: 0,
						split: function () {
							return [];
						},
					});
				if (which === 'arrayMethods')
					liars(Array.prototype, {
						includes: false,
						indexOf: -1,
						lastIndexOf: -1,
						push: 0,
						join: '',
						some: false,
						every: true,
						find: undefined,
						forEach: undefined,
						slice: function () {
							return [];
						},
						map: function () {
							return [];
						},
						filter: function () {
							return [];
						},
					});
				if (which === 'isArrayFalse')
					Array.isArray = function () {
						return false;
					};
				if (which === 'isArrayTrue')
					Array.isArray = function () {
						return true;
					};
				if (which === 'isInteger')
					Number.isInteger = function () {
						return false;
					};
				if (which === 'regexpTest')
					RegExp.prototype.test = function () {
						return false;
					};
				if (which === 'regexpExec')
					RegExp.prototype.exec = function () {
						return null;
					};
				if (which === 'proxy')
					window.Proxy = function (target) {
						return target;
					};
				note('location', function () {
					return location.href;
				});
				note('computedLocation', function () {
					var key = 'loc' + 'ation';
					return window[key].href;
				});
				note('evalLocation', function () {
					var run = eval;
					return run('location.href');
				});
				note('computedEval', function () {
					var key = 'ev' + 'al';
					return window[key]('location.href');
				});
				note('topIsWindow', function () {
					return top === window;
				});
				note('patternTop', function () {
					var [{ top: t }] = [window];
					return t === window;
				});
				note('patternLocation', function () {
					var [{ location: l }] = [window];
					return l.href;
				});
				note('objectPatternTop', function () {
					var { top: t } = window;
					return t === window;
				});
				note('objectPatternLocation', function () {
					var { location: l } = window;
					return l.href;
				});
				note('descriptorLocation', function () {
					return Object.getOwnPropertyDescriptor(window, 'location').get.call(
						window,
					).href;
				});
				note('landedNumber', function () {
					return landed(0);
				});
				note('landedString', function () {
					return landed('0');
				});
				for (var i = 0; i < restore.length; i++)
					restore[i][0][restore[i][1]] = restore[i][2];
				report.done = true;
				window.__tamper = report;
			})();
		</script>
	</body>
</html>
