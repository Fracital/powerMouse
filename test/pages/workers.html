<!doctype html>
<title>WORKERS</title>
<script>
	window.__wk = {};
	const record = (event) => {
		__wk[event.data[0]] = event.data[1];
	};
	try {
		const blob = new Blob(
			[
				"fetch('/pages/echo.json').then((r) => r.json()).then((j) => postMessage(['blob', j.ok]));",
			],
			{ type: 'text/javascript' },
		);
		const w = new Worker(URL.createObjectURL(blob));
		w.onmessage = record;
		w.onerror = (e) => {
			__wk.blob = 'error ' + e.message;
		};
	} catch (e) {
		__wk.blob = 'threw ' + e.message;
	}
	try {
		const m = new Worker('/pages/modworker.js', { type: 'module' });
		m.onmessage = record;
		m.onerror = (e) => {
			__wk.module = 'error ' + e.message;
		};
	} catch (e) {
		__wk.module = 'threw ' + e.message;
	}
	try {
		const s = new SharedWorker('/pages/shared.js');
		s.port.onmessage = record;
		s.onerror = (e) => {
			__wk.shared = 'error ' + e.message;
		};
	} catch (e) {
		__wk.shared = 'threw ' + e.message;
	}
	(CSS.paintWorklet
		? CSS.paintWorklet.addModule('/pages/paint.js')
		: Promise.reject(new Error('no paint worklet'))
	).then(
		() => {
			__wk.worklet = true;
		},
		(e) => {
			__wk.worklet = 'error ' + e.message;
		},
	);
	// an audio worklet's module runs (an offline context needs no device)
	try {
		const context = new OfflineAudioContext(1, 128, 44100);
		context.audioWorklet.addModule('/pages/worklet-processor.js').then(
			() => {
				const node = new AudioWorkletNode(context, 'workers-probe', {
					processorOptions: { tag: 'given' },
				});
				node.port.onmessage = (event) => {
					__wk.audio = event.data;
				};
				node.onprocessorerror = (event) => {
					__wk.audio = 'processorerror ' + (event.message ?? '');
				};
			},
			(e) => {
				__wk.audio = 'error ' + e.message;
			},
		);
	} catch (e) {
		__wk.audio = 'threw ' + e.message;
	}
	setTimeout(() => {
		__wk.done = true;
	}, 5000);
</script>
