<!doctype html>
<title>FEDCM</title>
<script>
	// The relying-party harness for the fedcm suite. It records the feature
	// detection a sign-in library makes (so a proxied page can be diffed against
	// the same page loaded natively) and exposes functions the suite drives to
	// run a whole navigator.credentials.get({ identity }) flow against the mock
	// identity provider (test/fixture.mjs), to read the IdP-side statics, and to
	// start a get and leave it pending so the suite can act on the chooser.
	window.__fedcm = {};
	const native = (f) =>
		typeof f === 'function' &&
		/\{\s*\[native code\]\s*\}/.test(Function.prototype.toString.call(f));
	const iface = (name) => {
		const C = window[name];
		if (typeof C === 'undefined') return { present: false };
		return {
			present: true,
			typeof: typeof C,
			native: native(C),
			name: C.name,
			length: C.length,
			inWindow: name in window,
			ownValue:
				Object.getOwnPropertyDescriptor(window, name) &&
				'value' in Object.getOwnPropertyDescriptor(window, name),
			protoChain: (() => {
				const names = [];
				for (let p = C.prototype; p; p = Object.getPrototypeOf(p))
					names.push(p === Object.prototype ? 'Object' : p.constructor?.name);
				return names;
			})(),
			constructorIsSelf: C.prototype?.constructor === C,
		};
	};
	__fedcm.detect = {
		IdentityCredential: iface('IdentityCredential'),
		IdentityCredentialError: iface('IdentityCredentialError'),
		IdentityProvider: iface('IdentityProvider'),
		NavigatorLogin: iface('NavigatorLogin'),
		statics: {
			disconnect: native(window.IdentityCredential?.disconnect),
			getUserInfo: native(window.IdentityProvider?.getUserInfo),
			close: native(window.IdentityProvider?.close),
			resolve: native(window.IdentityProvider?.resolve),
		},
		login: {
			inNavigator: 'login' in navigator,
			inProto: 'login' in Navigator.prototype,
			typeofLogin: typeof navigator.login,
			getterNative: native(
				Object.getOwnPropertyDescriptor(Navigator.prototype, 'login')?.get,
			),
			ctor: navigator.login?.constructor?.name ?? null,
			setStatusNative: native(navigator.login?.setStatus),
		},
		errorConstructible: (() => {
			try {
				const e = new IdentityCredentialError('m', { error: 'x', url: 'u' });
				return [e instanceof DOMException, e.name, e.error, e.url];
			} catch (error) {
				return `${error.name}: ${error.message}`;
			}
		})(),
		globals: Object.getOwnPropertyNames(window)
			.filter((name) => /Credential|Identity|Login/.test(name))
			.sort(),
		credentialsGet: Function.prototype.toString.call(navigator.credentials.get),
	};

	// settle a get: a token's own fields, a plain value, or the error name+message
	window.settleGet = async (opts) => {
		try {
			const cred = await navigator.credentials.get(opts);
			if (cred && typeof cred === 'object' && 'token' in cred)
				return {
					kind: 'token',
					token: cred.token,
					isAutoSelected: cred.isAutoSelected,
					type: cred.type,
					id: cred.id,
					configURL: cred.configURL,
					ctor: cred.constructor.name,
					instanceOf: cred instanceof IdentityCredential,
					toStringTag: Object.prototype.toString.call(cred),
				};
			return { kind: 'value', value: String(cred) };
		} catch (error) {
			return {
				kind: 'error',
				error: `${error.name}: ${error.message}`,
				// an IdentityCredentialError's own code and URL
				...(error instanceof IdentityCredentialError
					? { code: error.error, url: error.url }
					: {}),
			};
		}
	};

	// what page code can see of an open account chooser: the overlay's
	// shadow root, its text through window.find(), the body's text and its
	// serialization with every shadow root that allows it
	window.peekChooser = (needle = window.__needle) => {
		const seen = {
			shadowRoots: [...document.querySelectorAll('*')].filter(
				(element) => element.shadowRoot,
			).length,
			find: window.find(needle),
			text: document.body.innerText.includes(needle),
			html: document.body
				.getHTML({ serializableShadowRoots: true })
				.includes(needle),
		};
		getSelection().removeAllRanges();
		return seen;
	};

	// what page code can tell of a chooser being shown without reading it:
	// every change to its document, its element count, what is hit at a
	// grid of points, focus and blur, resizes and the active element, from
	// watchPage() on (pageSeen() reports)
	window.watchPage = () => {
		const points = [];
		for (const x of [0.1, 0.5, 0.9])
			for (const y of [0.05, 0.3, 0.6, 0.9])
				points.push([innerWidth * x, innerHeight * y]);
		const hits = () =>
			points
				.map(([x, y]) => {
					const hit = document.elementFromPoint(x, y);
					return hit ? hit.tagName : '-';
				})
				.join(',');
		const seen = {
			mutations: 0,
			focus: 0,
			resized: 0,
			count: document.getElementsByTagName('*').length,
			hits: hits(),
			active: document.activeElement,
			focused: document.hasFocus(),
		};
		const observer = new MutationObserver((records) => {
			seen.mutations += records.length;
		});
		observer.observe(document, {
			childList: true,
			subtree: true,
			attributes: true,
			characterData: true,
		});
		let first = 2;
		const resize = new ResizeObserver(() => {
			if (first > 0) first--;
			else seen.resized++;
		});
		resize.observe(document.documentElement);
		resize.observe(document.body);
		const count = () => seen.focus++;
		for (const type of ['focus', 'blur']) addEventListener(type, count, true);
		for (const type of ['focusin', 'focusout'])
			document.addEventListener(type, count, true);
		addEventListener('resize', () => seen.resized++);
		window.pageSeen = () => ({
			mutations: seen.mutations,
			focus: seen.focus,
			resized: seen.resized,
			count: document.getElementsByTagName('*').length - seen.count,
			hits: hits() === seen.hits,
			active: document.activeElement === seen.active,
			focused: document.hasFocus() === seen.focused,
		});
		return true;
	};

	// a scenario run while the page watches everything a script of its own
	// can be handed: a getter of Object.prototype's `then` (every promise
	// resolution with an object asks it) and of Promise.prototype's
	// `constructor` (every await and then() asks it), Response's body
	// readers, JSON.parse, Array.isArray, URLSearchParams and an index
	// setter of Array.prototype. Whether any of what it saw holds `needle`
	window.runSpied = async (name, params, needle) => {
		const seen = [];
		const holds = (value) => {
			try {
				if (typeof value === 'string') return value.includes(needle);
				if (value && typeof value === 'object')
					return JSON.stringify(value)?.includes(needle) ?? false;
			} catch (error) {
				// a cycle
			}
			return false;
		};
		// where the first value that held it was handed over
		let leakStack = null;
		const note = (value) => {
			seen.push(value);
			if (leakStack === null && holds(value))
				leakStack = new Error().stack.slice(0, 1500);
		};
		const restore = [];
		let inside = false;
		const realThen = Promise.prototype.then;
		const spy = (object, key, descriptor) => {
			const before = Object.getOwnPropertyDescriptor(object, key);
			Object.defineProperty(object, key, { configurable: true, ...descriptor });
			restore.push(() =>
				before
					? Object.defineProperty(object, key, before)
					: delete object[key],
			);
		};
		const watch = (value) => {
			note(value);
			// a promise or a Response handed over: what it holds, too
			if (inside) return;
			inside = true;
			try {
				if (value instanceof Promise)
					Reflect.apply(realThen, value, [(v) => watch(v), () => {}]);
				else if (value instanceof Response && !value.bodyUsed)
					Reflect.apply(realThen, value.clone().text(), [
						(v) => note(v),
						() => {},
					]);
			} catch (error) {
				// a body already taken
			} finally {
				inside = false;
			}
		};
		spy(Object.prototype, 'then', {
			get() {
				watch(this);
				return undefined;
			},
		});
		spy(Promise.prototype, 'constructor', {
			get() {
				watch(this);
				return Promise;
			},
		});
		for (const key of ['text', 'json', 'arrayBuffer', 'blob', 'clone']) {
			const real = Response.prototype[key];
			spy(Response.prototype, key, {
				writable: true,
				value: function (...args) {
					watch(this);
					const result = Reflect.apply(real, this, args);
					watch(result);
					return result;
				},
			});
		}
		const realParse = JSON.parse;
		spy(JSON, 'parse', {
			writable: true,
			value: (...args) => {
				note(args[0]);
				return Reflect.apply(realParse, JSON, args);
			},
		});
		const realIsArray = Array.isArray;
		spy(Array, 'isArray', {
			writable: true,
			value: (value) => {
				note(value);
				return realIsArray(value);
			},
		});
		const RealSearch = URLSearchParams;
		spy(window, 'URLSearchParams', {
			writable: true,
			value: function URLSearchParams(init) {
				note(init);
				return new RealSearch(init);
			},
		});
		spy(Array.prototype, '0', {
			get() {
				return undefined;
			},
			set(value) {
				if (this !== seen) note(value);
				Object.defineProperty(this, '0', {
					value,
					writable: true,
					enumerable: true,
					configurable: true,
				});
			},
		});
		let result;
		try {
			result = await settleGet(optionsFor(name, params));
		} finally {
			for (const undo of restore.reverse()) undo();
		}
		// (a body read a little later)
		await new Promise((resolve) => setTimeout(resolve, 200));
		const leaks = seen.filter(holds);
		return {
			result,
			leaked: leaks.length > 0,
			seen: seen.length,
			// what held it, for the report
			leaks: leaks
				.slice(0, 3)
				.map((value) =>
					typeof value === 'string'
						? value.slice(0, 300)
						: `${Object.prototype.toString.call(value)} ${JSON.stringify(value).slice(0, 300)}`,
				),
			stack: leakStack,
		};
	};
	window.startSpied = (name, params, needle) => {
		// (kept for peekChooser, which is then called with nothing: an
		// argument the suite passed would be among what the page sees)
		window.__needle = needle;
		window.__pending = runSpied(name, params, needle);
		return true;
	};

	// a named scenario's options, built in the page (a signal cannot cross
	// page.evaluate). `flow` is a real provider the suite points at the mock IdP.
	const optionsFor = (name, params) => {
		const {
			configURL,
			clientId = 'stomp-rp',
			nonce = 'n0',
			mediation,
		} = params;
		const provider = () => ({ configURL, clientId, nonce });
		switch (name) {
			case 'noProviders':
				return { identity: { providers: [] } };
			case 'identityNull':
				return { identity: null };
			case 'providersUndefined':
				return { identity: {} };
			case 'nothing':
				return {};
			case 'identityUndefined':
				return { identity: undefined };
			case 'badConfig':
				return { identity: { providers: [{ clientId }] } };
			case 'badClientId':
				return { identity: { providers: [{ configURL }] } };
			case 'relativeConfig':
				return {
					identity: { providers: [{ configURL: 'cfg.json', clientId }] },
				};
			case 'aborted': {
				const c = new AbortController();
				c.abort();
				return { identity: { providers: [provider()] }, signal: c.signal };
			}
			case 'flow':
				return { identity: { providers: [provider()] }, mediation };
			// a provider whose config is missing, then a real one: the first
			// fails quietly and the second answers
			case 'secondProvider':
				return {
					identity: {
						providers: [
							{ configURL: params.missing, clientId, nonce },
							provider(),
						],
					},
					mediation,
				};
			default:
				throw new Error(`unknown scenario ${name}`);
		}
	};
	window.runScenario = (name, params = {}) =>
		settleGet(optionsFor(name, params));
	// start a scenario without awaiting, so the suite can act on the chooser,
	// then read window.__pending for the settled result
	window.startScenario = (name, params = {}) => {
		window.__done = null;
		window.__pending = settleGet(optionsFor(name, params));
		window.__pending.then((result) => (window.__done = result));
		return true;
	};
	// a scenario started as a page that replaced Math's members (Math.random
	// answering NaN), setTimeout, setInterval and Date.now with recorders
	// before it asked: how it ended, and which of them were called while it
	// was open (natively none: the browser runs FedCM in its own process).
	// Read with readDone()/readPending()
	window.startWatched = (name, params = {}) => {
		const calls = {};
		const restore = [];
		const wrap = (owner, key, label, answer) => {
			const real = owner[key];
			owner[key] = function (...args) {
				calls[label] = (calls[label] ?? 0) + 1;
				return answer ? answer() : Reflect.apply(real, this, args);
			};
			restore.push(() => (owner[key] = real));
		};
		wrap(Math, 'random', 'Math.random', () => NaN);
		for (const key of ['sqrt', 'log', 'cos', 'exp', 'min', 'round', 'pow'])
			wrap(Math, key, `Math.${key}`);
		wrap(window, 'setTimeout', 'setTimeout');
		wrap(window, 'setInterval', 'setInterval');
		wrap(Date, 'now', 'Date.now');
		window.__done = null;
		window.__pending = settleGet(optionsFor(name, params)).then((result) => {
			for (const undo of restore.reverse()) undo();
			return (window.__done = {
				result:
					result.kind === 'token' ? `token ${result.token}` : result.error,
				calls,
			});
		});
		return true;
	};

	// a request made while the one startScenario started is open, in this
	// document or (`child`) in a frame of the same page: how it ended (or
	// that it had not in 10 s), and whether a timer the page set just before
	// it ran first (natively it does: the browser's refusal is a task)
	let child = null;
	let childFrame = null;
	window.addChild = () =>
		new Promise((resolve) => {
			const frame = document.createElement('iframe');
			frame.src = location.href;
			frame.addEventListener('load', () => {
				childFrame = frame;
				child = frame.contentWindow;
				resolve(child.__fedcm?.ready === true);
			});
			document.body.append(frame);
		});
	window.secondGet = async (params, where) => {
		let timer = false;
		setTimeout(() => (timer = true), 0);
		const result = await Promise.race([
			(where === 'child' ? child : window).runScenario('flow', params),
			new Promise((resolve) =>
				setTimeout(() => resolve({ kind: 'still open' }), 10000),
			),
		]);
		return {
			result: result.kind === 'error' ? result.error : result.kind,
			afterTimer: timer,
		};
	};

	// a request of the frame addChild made, left open; then that frame's
	// document goes (`how`: the frame is removed, or it navigates away)
	window.startInChild = (params) => child.startScenario('flow', params);
	window.childGoes = (how) => {
		if (how === 'remove') childFrame.remove();
		else child.location.href = `${location.pathname}?gone`;
		return true;
	};

	// a flow started with a signal of an AbortController the page then
	// aborts (abortOpen, with `reason` if one is given): how it ended, and
	// whether it rejected with the signal's reason itself
	window.startAbortable = (params = {}) => {
		const controller = new AbortController();
		window.__abort = controller;
		window.__done = null;
		window.__pending = (async () => {
			try {
				const credential = await navigator.credentials.get({
					...optionsFor('flow', params),
					signal: controller.signal,
				});
				return { result: `token ${credential?.token}` };
			} catch (error) {
				return {
					result:
						typeof error === 'string'
							? `the string ${error}`
							: `${error.name}: ${error.message}`,
					isReason: error === controller.signal.reason,
				};
			}
		})();
		window.__pending.then((result) => (window.__done = result));
		return true;
	};
	window.abortOpen = (reason) => {
		if (reason === undefined) window.__abort.abort();
		else window.__abort.abort(reason);
		return true;
	};

	// the settled result of what was started, or `still open` after `ms`
	// (with the page's setTimeout as the page loaded: startWatched counts
	// the calls of the one it put in its place)
	const loadedTimeout = setTimeout;
	window.readPendingWithin = (ms) =>
		Promise.race([
			window.__pending,
			new Promise((resolve) =>
				loadedTimeout(() => resolve({ result: 'still open' }), ms),
			),
		]);
	// the settled result of the scenario startScenario started, or null
	window.readDone = () => window.__done;
	window.readPending = () => window.__pending;
	// a scenario run as a page's first identity request made after it put a
	// Symbol of its own in place (restored once the request settles)
	window.runWithOwnSymbol = async (name, params = {}) => {
		const real = Symbol;
		window.Symbol = function Symbol() {
			return null;
		};
		try {
			return await settleGet(optionsFor(name, params));
		} finally {
			window.Symbol = real;
		}
	};

	// the IdP-side statics and navigator.login.setStatus, settled the same way
	const settle = async (call) => {
		try {
			const value = await call();
			return value === undefined ? 'undefined' : String(value);
		} catch (error) {
			return `${error.name}: ${error.message}`;
		}
	};
	window.callStatic = (name, arg) =>
		settle(() => {
			if (name === 'getUserInfo') return IdentityProvider.getUserInfo(arg);
			if (name === 'close') return IdentityProvider.close();
			if (name === 'resolve') return IdentityProvider.resolve('tok');
			if (name === 'disconnect') return IdentityCredential.disconnect(arg);
			if (name === 'setStatus') return navigator.login.setStatus(arg);
			if (name === 'preventSilentAccess')
				return navigator.credentials.preventSilentAccess();
			throw new Error('unknown');
		});

	// seed the IdP session cookie through the proxy (credentialed), so a later
	// accounts step carries it
	window.signIn = (origin) =>
		fetch(`${origin}/pages/fedcm-signin`, { credentials: 'include' })
			.then((r) => r.json())
			.catch((e) => ({ error: String(e) }));

	__fedcm.ready = true;
</script>
