<!doctype html>
<title>ADV SCRIPTS</title>
<pre id="result">pending</pre>
<script src="adv-harness.js"></script>
<script>
	// document.write during parsing is a route of its own
	document.write(
		'<script>' + __advPayload('document.write script') + '<\/script>',
	);
	document.writeln(
		'<script>' + __advPayload('document.writeln script') + '<\/script>',
	);
	document.write(
		'<svg><script>' +
			__advPayload('document.write svg script') +
			'<\/script></svg>',
	);
	document.write(
		'<img src="x:" onerror=\'' +
			__advPayload('document.write img onerror') +
			"'>",
	);
</script>
<script>
	// Every route by which text becomes running script: script element text
	// setters and text-node mutations, script src from data:/blob:, inline
	// event handler attributes set through every attribute API, markup parsed
	// into shadow roots and foreign documents then adopted, XSLT output, SVG
	// script, srcdoc frames, and javascript: URLs (scramjet: llm/escapes.ts,
	// documentwrite.ts, foreigncontext.ts). A route is contained when its
	// payload saw the spoofed top and the page's URL; 'did-not-run' means the
	// browser itself never executed it.
	const R = __advRecord;
	const P = __advProbe;
	const A = __advAsync;
	const C = __advPayload;
	const CC = __advChildPayload;
	const route = (name, fn) => {
		R(name, 'did-not-run');
		try {
			fn(C(name));
		} catch (error) {
			R(name, undefined, error);
		}
	};
	const childRoute = (name, fn) => {
		R(name, 'did-not-run');
		try {
			fn(CC(name));
		} catch (error) {
			R(name, undefined, error);
		}
	};
	const script = (fn) => {
		const s = document.createElement('script');
		fn(s);
		document.body.append(s);
	};

	route('script.innerText', (p) => script((s) => (s.innerText = p)));
	route('script.textContent', (p) => script((s) => (s.textContent = p)));
	route('script.innerHTML', (p) => script((s) => (s.innerHTML = p)));

	route('script.insertAdjacentText', (p) =>

		s.append(t);

	route('script.text after insertion', (p) => {

	route('script.setAttribute(src, data:)', (p) =>

	route('script.setAttributeNS(src, data:)', (p) =>

	route('script.setAttributeNode(src, data:)', (p) =>

	route('script.attributes.setNamedItem(src, data:)', (p) =>

	route('script.src = blob:', (p) =>

	route('setAttributeNodeNS onclick', (p) =>
		click((b) => {
			const a = document.createAttributeNS(null, 'onclick');

		}),

	route('toggleAttribute then value', (p) =>
		click((b) => {
			b.toggleAttribute('onclick', true);

		}),
	);
	route('div.innerHTML img onerror', (p) => {
		const d = document.createElement('div');
		d.innerHTML = '<img src="x:" onerror=\'' + p + "'>";
		document.body.append(d);
	});
	route('outerHTML img onerror', (p) => {
		const d = document.createElement('div');
		document.body.append(d);
		d.outerHTML = '<img src="x:" onerror=\'' + p + "'>";
	});
	route('insertAdjacentHTML img onerror', (p) =>
		document.body.insertAdjacentHTML(
			'beforeend',
			'<img src="x:" onerror=\'' + p + "'>",
		),
	);
	route('setHTMLUnsafe img onerror', (p) => {
		const d = document.createElement('div');
		document.body.append(d);
		if (!d.setHTMLUnsafe) throw new Error('no setHTMLUnsafe');
		d.setHTMLUnsafe('<img src="x:" onerror=\'' + p + "'>");

	route('shadowRoot.innerHTML img onerror', (p) => {
		const host = document.createElement('div');
		const root = host.attachShadow({ mode: 'open' });
		document.body.append(host);
		root.innerHTML = '<img src="x:" onerror=\'' + p + "'>";

	route('shadowRoot.setHTMLUnsafe img onerror', (p) => {
		const host = document.createElement('div');
		const root = host.attachShadow({ mode: 'open' });
		document.body.append(host);
		if (!root.setHTMLUnsafe) throw new Error('no setHTMLUnsafe');
		root.setHTMLUnsafe('<img src="x:" onerror=\'' + p + "'>");
	});
	route('shadowRoot script', (p) => {
		const host = document.createElement('div');
		const root = host.attachShadow({ mode: 'open' });
		document.body.append(host);
		const s = document.createElement('script');
		s.textContent = p;
		root.append(s);
	});
	route('declarative shadow DOM img onerror', (p) => {
		const d = document.createElement('div');
		if (!d.setHTMLUnsafe) throw new Error('no setHTMLUnsafe');
		d.setHTMLUnsafe(
			'<span><template shadowrootmode="open"><img src="x:" onerror=\'' +
				p +
				"'></template></span>",
		);
		document.body.append(d);
	});
	route('createContextualFragment img onerror', (p) => {
		const range = document.createRange();
		range.selectNodeContents(document.body);
		document.body.append(
			range.createContextualFragment('<img src="x:" onerror=\'' + p + "'>"),
		);
	});
	route('template img onerror adopted', (p) => {
		const tpl = document.createElement('template');
		tpl.innerHTML = '<img src="x:" onerror=\'' + p + "'>";
		document.body.append(document.importNode(tpl.content, true));
	});
	route('Document.parseHTMLUnsafe img onerror adopted', (p) => {
		if (!Document.parseHTMLUnsafe) throw new Error('no parseHTMLUnsafe');
		const doc = Document.parseHTMLUnsafe('<img src="x:" onerror=\'' + p + "'>");
		document.body.append(doc.querySelector('img'));
	});
	route('DOMParser html img onerror adopted', (p) => {
		const doc = new DOMParser().parseFromString(
			'<img src="x:" onerror=\'' + p + "'>",
			'text/html',
		);
		document.body.append(doc.querySelector('img'));
	});
	route('DOMParser xhtml img onerror adopted', (p) => {
		const doc = new DOMParser().parseFromString(
			'<?xml version="1.0"?><html xmlns="http://www.w3.org/1999/xhtml"><body><img src="x:" onerror=\'' +
				p +
				"'/></body></html>",
			'application/xhtml+xml',
		);
		document.body.append(doc.querySelector('img'));
	});
	route('DOMParser svg img onerror adopted', (p) => {
		const doc = new DOMParser().parseFromString(
			'<svg xmlns="http://www.w3.org/2000/svg"><image href="x:" onerror=\'' +
				p +
				"'/></svg>",

	route('createHTMLDocument img onerror adopted', (p) => {
		const doc = document.implementation.createHTMLDocument('');
		doc.body.innerHTML = '<img src="x:" onerror=\'' + p + "'>";
		document.body.append(doc.querySelector('img'));

	route('XSLT transformToFragment img onerror', (p) => {
		const xml = new DOMParser().parseFromString('<root/>', 'text/xml');
		const xsl = new DOMParser().parseFromString(
			'<?xml version="1.0"?><xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform"><xsl:output method="html" omit-xml-declaration="yes"/><xsl:template match="/"><img xmlns="http://www.w3.org/1999/xhtml" src="x:" onerror=\'' +

	route('XSLT transformToDocument img onerror', (p) => {
		const xml = new DOMParser().parseFromString('<root/>', 'text/xml');
		const xsl = new DOMParser().parseFromString(
			'<?xml version="1.0"?><xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform"><xsl:output method="xml" omit-xml-declaration="yes"/><xsl:template match="/"><html xmlns="http://www.w3.org/1999/xhtml"><body><img src="x:" onerror=\'' +

	const SVG = 'http://www.w3.org/2000/svg';
	const XLINK = 'http://www.w3.org/1999/xlink';
	route('svg script textContent', (p) => {
		const svg = document.createElementNS(SVG, 'svg');
		const s = document.createElementNS(SVG, 'script');
		s.textContent = p;
		svg.appendChild(s);
		document.body.append(svg);

	route('svg script xlink:href data:', (p) => {
		const svg = document.createElementNS(SVG, 'svg');
		const s = document.createElementNS(SVG, 'script');
		s.setAttributeNS(
			XLINK,
			'href',
			'data:text/javascript,' + encodeURIComponent(p),
		);

		document.body.append(svg);

	route('svg script href data:', (p) => {
		const svg = document.createElementNS(SVG, 'svg');
		const s = document.createElementNS(SVG, 'script');
		s.setAttribute('href', 'data:text/javascript,' + encodeURIComponent(p));

		document.body.append(svg);

		const svg = document.createElementNS(SVG, 'svg');
		const i = document.createElementNS(SVG, 'image');

		const svg = document.createElementNS(SVG, 'svg');

	const svgIn = (fn) => {
		const svg = document.createElementNS(SVG, 'svg');

		const s = ns
			? document.createElementNS(SVG, 'script')

			document.body.append(svg);

	const FILLS = {
		textContent: (s, p) => (s.textContent = p),
		innerHTML: (s, p) => (s.innerHTML = p),
		'append(string)': (s, p) => s.append(p),
		'appendChild(textNode)': (s, p) =>
			s.appendChild(document.createTextNode(p)),
		'prepend(string)': (s, p) => s.prepend(p),
		'replaceChildren(string)': (s, p) => s.replaceChildren(p),
		'insertBefore(textNode)': (s, p) =>
			s.insertBefore(document.createTextNode(p), null),
		insertAdjacentText: (s, p) => s.insertAdjacentText('beforeend', p),
		insertAdjacentHTML: (s, p) => s.insertAdjacentHTML('beforeend', p),
		setHTMLUnsafe: (s, p) => s.setHTMLUnsafe(p),
		'append(fragment)': (s, p) => {
			const f = document.createDocumentFragment();
			f.append(p);
			s.append(f);
		},
		'Range.insertNode(textNode)': (s, p) => {
			const range = document.createRange();
			range.selectNodeContents(s);
			range.insertNode(document.createTextNode(p));

		route('svg script connected ' + fill, (p) =>

	childRoute('about:blank contentWindow.Function', (p) => {
		const f = document.createElement('iframe');
		document.body.append(f);
		f.contentWindow.Function(p)();
	});
	childRoute('about:blank setTimeout string', (p) => {
		const f = document.createElement('iframe');
		document.body.append(f);
		f.contentWindow.setTimeout(p, 0);
	});
	// javascript: URLs on a window. Any of these may navigate the window away
	// through the proxy, which would end this page, so each runs in a child
	// frame of its own (adv-child.html?nav=<route>, same inject as this page)
	// that reports back; afterwards the parent reads where the child frame
	// ended up.
	const NAV_ROUTES = [
		'iframe.src = javascript:',
		'iframe.setAttribute(src, javascript:)',
		'about:blank location = javascript:',
		'object data=javascript:',
		'embed src=javascript:',
		'a href=javascript: click',
		'a setAttribute(href, javascript:) click',
		'a setAttributeNode(href, javascript:) click',
		'area href=javascript: click',
		'form action=javascript: submit',
		'form button formaction=javascript:',
		'location.assign(javascript:)',
		'location.replace(javascript:)',
		'location.href = javascript:',
		'location = javascript:',
		'window.location = javascript:',
		'document.location = javascript:',
		'Reflect.set(window, location, javascript:)',
		'Reflect.set(document, location, javascript:)',
		'Object.assign(window, {location})',
		'Object.assign(document, {location})',
		'gOPD(window, location).set.call',
		'history.pushState then javascript:',
		'window.open(javascript:)',
		'window.open(javascript:, _self)',
		'window.open(javascript:, _blank)',
		'window.open() then location = javascript:',
		'window.open(about:blank) then location.href = javascript:',
		'window.open() then eval',
		'document.open(javascript:, _blank, features)',
		'window.open(javascript:, _parent)',
		'window.open(javascript:, _top)',
		'a target=_parent href=javascript: click',
		'a target=_top href=javascript: click',
		'form target=_parent action=javascript: submit',
		'form target=_top action=javascript: requestSubmit',
		'button formtarget=_parent formaction=javascript: click',
		'base target=_parent, a href=javascript: click',
		'a target=new window href=javascript: click',
		'parent.location = javascript:',
		'top.location.href = javascript:',
		'window.open(javascript:, named frame)',
		'a target=named frame href=javascript: click',
		'form target=named frame action=javascript: submit',
		'iframe contentWindow.location.href = javascript:',
		'iframe contentWindow.location.assign(javascript:)',
		'iframe contentWindow.location.replace(javascript:)',
		'frames[0].location = javascript:',
		'iframe src=javascript: in innerHTML',
		'iframe loaded then src = javascript:',
		'location = JaVaScRiPt:',
		'location = java\\tscript:',
		'location = leading controls javascript:',
		'a href=jav&Tab;ascript: in innerHTML click',
		'a href= leading space javascript: click',
		'svg a href=javascript: click',
		'svg a xlink:href=javascript: click',
		'svg a href.baseVal = javascript: click',
		'svg a set href to=javascript: click',
		'input type=submit formaction=javascript:',
		'form.requestSubmit(button formaction=javascript:)',

		'location.href = javascript: via Reflect.set(location)',
		'location.assign.call(location, javascript:)',
		'document.location.assign(javascript:)',
		"window['loc' + 'ation'] = javascript:",
		'self.location = javascript:',
		'meta refresh javascript:',

	// The parent and the top a frame two levels down means are the proxied
	// ones, for a javascript: URL (its code runs in the window it is aimed
	// at) and for a document (that window navigates, the frame stays). The
	// frames are about:blank ones this page makes; `_top` is this page, so
	// only code is aimed at it.
	const twoDown = async () => {
		const outer = document.createElement('iframe');
		document.body.append(outer);
		await new Promise((r) => setTimeout(r, 50));
		const inner = outer.contentDocument.createElement('iframe');
		outer.contentDocument.body.append(inner);
		await new Promise((r) => setTimeout(r, 50));
		return [outer.contentWindow, inner.contentWindow, outer];
	};
	const AIMED = {
		'window.open': (w, url, target) => w.open(url, target),
		a: (w, url, target) => {
			const a = w.document.createElement('a');
			a.href = url;
			a.target = target;
			w.document.body.append(a);
			a.click();
		},
		'form.submit': (w, url, target) => {
			const f = w.document.createElement('form');
			// a GET form's fields are its query
			f.action = url.replace('?name=aimed', '');
			f.target = target;
			f.innerHTML = '<input type="hidden" name="name" value="aimed">';
			w.document.body.append(f);
			f.submit();
		},
		'form POST requestSubmit': (w, url, target) => {
			const f = w.document.createElement('form');
			f.action = url;
			f.method = 'post';
			f.target = target;
			f.innerHTML = '<input type="hidden" name="posted" value="1">';
			w.document.body.append(f);
			f.requestSubmit();
		},
	};
	let aimedCount = 0;
	for (const [how, aim] of Object.entries(AIMED)) {
		for (const target of ['_parent', '_top']) {
			const key = '__advAimed' + aimedCount++;
			A(
				'two frames down: ' + how + ' javascript: at ' + target,
				async () => {
					const [outer, inner] = await twoDown();
					aim(
						inner,
						'javascript:void (window.' +
							key +
							' = top === window ? "its own top" : "under this page")',
						target,
					);
					await new Promise((r) => setTimeout(r, 1000));
					const ran = (w) => (w[key] === undefined ? 'no' : w[key]);
					const saw =
						'page: ' +
						ran(window) +
						', outer: ' +
						ran(outer) +
						', inner: ' +
						ran(inner);
					return saw ===
						(target === '_top'
							? 'page: its own top, outer: no, inner: no'
							: 'page: no, outer: under this page, inner: no')
						? 'ran in ' + target
						: 'TELL:' + saw;
				},
				8000,
			);
		}
		A(
			'two frames down: ' + how + ' a document at _parent',
			async () => {
				const [outer, inner, element] = await twoDown();
				// the parent's new document is read once it has loaded: before
				// that its window may hold a document no script has run in yet
				const loaded = new Promise((r) => {
					element.addEventListener('load', r, { once: true });
					setTimeout(r, 6000);
				});
				aim(inner, 'adv-child.html?name=aimed', '_parent');
				await loaded;
				await new Promise((r) => setTimeout(r, 200));
				const path = (href) => href.replace(/^.*\//, '');
				let innerNow = 'gone';
				if (outer.frames.length) innerNow = path(outer.frames[0].location.href);
				const saw = path(outer.location.href) + ', inner: ' + innerNow;
				return saw === 'adv-child.html?name=aimed, inner: gone'
					? 'the parent navigated'
					: 'TELL:' + saw;
			},
			8000,
		);
	}
	const startNav = (i) => {
		if (i >= NAV_ROUTES.length) return __advFinish(3500);
		const name = NAV_ROUTES[i];
		R(name, 'child frame did not load');
		const f = document.createElement('iframe');
		f.src = 'adv-child.html?nav=' + encodeURIComponent(name);
		f.addEventListener(
			'load',
			() =>
				setTimeout(() => {
					try {
						const u = f.contentWindow.location.href;
						R(
							name + ' [frame url after]',
							new URL(u).searchParams.get('nav') === name
								? 'unchanged'
								: 'TELL:navigated to ' + u,
						);
					} catch (error) {
						R(name + ' [frame url after]', 'threw ' + error.name);
					}
				}, 1500),
			{ once: true },
		);
		document.body.append(f);
		setTimeout(() => startNav(i + 1), 300);
	};
	startNav(0);
</script>
