<!doctype html>
<title>LOCATION WRITES</title>
<script src="location-writes.js"></script>
<body>
	<script>
		// A frame per case of location-writes.js (`?only=<name>` runs one, for
		// the cases that navigate the top page); __loads counts each frame's
		// loads, so a write that navigates nothing natively shows a reload.
		// The cases that open a window run in a harness of their own
		// (`?popups`): a window opened while many frames navigate leaves, now
		// and then, a frame whose next document never parses (Chrome pauses
		// the renderer's frames while it creates the window, and one that
		// commits a document then is not resumed; it does with DevTools'
		// waitForDebuggerOnStart off too)
		(function () {
			window.__loads = {};
			var params = new URLSearchParams(location.search);
			var only = params.get('only');
			var popups = params.has('popups');
			var names = only
				? [only]
				: Object.keys(LOCATION_WRITES).filter(function (name) {
						var entry = LOCATION_WRITES[name];
						return !entry.child && !entry.alone && !!entry.popup === popups;
					});
			window.__names = names;
			names.forEach(function (name) {
				var frame = document.createElement('iframe');
				frame.name = 'case-' + name;
				frame.onload = function () {
					window.__loads[name] = (window.__loads[name] || 0) + 1;
				};
				frame.src = 'location-write.html?c=' + name;
				document.body.append(frame);
			});
		})();
	</script>
</body>
