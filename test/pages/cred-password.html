<!doctype html>
<meta charset="utf-8" />
<title>cred-password</title>
<body></body>
<script>
	// Password and federated credentials: a get and a store at the top, in a
	// same-site child and in a cross-site child (cred-password-child.html)
	const ops = async () => {
		const run = async (fn) => {
			try {
				const value = await Promise.race([
					fn(),
					new Promise((resolve) => setTimeout(() => resolve('pending'), 3000)),
				]);
				return value === null || value === undefined
					? String(value)
					: typeof value;
			} catch (error) {
				return `${error.name}: ${error.message}`;
			}
		};
		return {
			'get password': await run(() =>
				navigator.credentials.get({ password: true }),
			),
			'get federated': await run(() =>
				navigator.credentials.get({
					federated: { providers: ['https://idp.example'] },
				}),
			),
			'store password': await run(() =>
				navigator.credentials.store(
					new PasswordCredential({ id: 'user', password: 'secret' }),
				),
			),
			'store federated': await run(() =>
				navigator.credentials.store(
					new FederatedCredential({
						id: 'user',
						provider: 'https://idp.example',
					}),
				),
			),
		};
	};
	if (parent !== window) {
		ops().then((result) =>
			parent.postMessage({ child: location.search, result }, '*'),
		);
	} else
		(async () => {
			const cases = { top: await ops() };
			const cross = `${location.protocol}//localhost:${location.port}`;
			for (const [label, src] of [
				['same-site child', 'cred-password.html?same'],
				['cross-site child', `${cross}/pages/cred-password.html?cross`],
			]) {
				const frame = document.createElement('iframe');
				const got = new Promise((resolve) => {
					addEventListener('message', function take(event) {
						if (!event.data?.result) return;
						removeEventListener('message', take);
						resolve(event.data.result);
					});
					setTimeout(() => resolve('none'), 15000);
				});
				frame.src = src;
				document.body.append(frame);
				cases[label] = await got;
			}
			window.__pi = { done: true, cases };
		})();
</script>
