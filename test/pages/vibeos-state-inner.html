<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>vibeOS state inner</title>
	</head>
	<body>
		<p id="ticks">0</p>
		<script>
			window.ticks = 0;
			setInterval(() => {
				window.ticks++;
				document.getElementById('ticks').textContent = window.ticks;
			}, 25);
		</script>
	</body>
</html>
