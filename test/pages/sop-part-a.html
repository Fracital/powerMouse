<!doctype html>
<title>SOP PARTITION A</title>
<body>
	<script>
		// a page framing `?src=` (sop-partitions suite): another site's page
		// framing B, or one link of a longer chain; keeps what the frame
		// reports
		const query = new URLSearchParams(location.search);
		addEventListener('message', (event) => {
			if (event.data?.sopPart) window.__part = event.data.sopPart;
		});
		const frame = document.createElement('iframe');
		frame.src = query.get('src');
		document.body.append(frame);
	</script>
</body>
