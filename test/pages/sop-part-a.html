<!doctype html>
<title>SOP PARTITION A</title>
<body>
	<script>
		// a page framing `?src=` (sop-partitions suite): another site's page
		// framing B, or one link of a longer chain; keeps what the frame
		// reports
		const query = new URLSearchParams(location.search);
		addEventListener('message', (event) => {
			if (event.data?.sopPart) window.__part = event.data.sopPart;
		});
		// `?cl=1`: the frames are credentialless ones (the credentialless
		// suite), set by the property, which reads back what it was given.
		// Each further `src` is framed once the one before it reported
		const sources = query.getAll('src');
		window.__attribute = [];
		window.__framing = location.href;
		const frameNext = () => {
			const frame = document.createElement('iframe');
			if (query.get('cl')) frame.credentialless = true;
			window.__attribute.push(frame.credentialless);
			frame.src = sources.shift();
			document.body.append(frame);
		};
		if (sources.length > 1)
			addEventListener('message', (event) => {
				if (event.data?.sopPart && sources.length) frameNext();
			});
		frameNext();
	</script>
</body>
