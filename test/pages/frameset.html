<!doctype html>
<html>
	<head>
		<title>FRAMESET</title>
		<script>
			window.__fs = {};
			addEventListener('load', () => {
				try {
					__fs.aHref = frames.a.location.href;
					__fs.aTitle = frames.a.document.title;
					const b = document.getElementsByName('b')[0];
					b.contentDocument.open();
					b.contentDocument.write('<a id="x" href="/fb">x</a>');
					b.contentDocument.close();
					const x = b.contentDocument.getElementById('x');
					__fs.bAttr = x.getAttribute('href');
					__fs.bHref = x.href;
					__fs.bNames = x.getAttributeNames();
				} catch (error) {
					__fs.error = String(error);
				}
				__fs.done = true;
			});
		</script>
	</head>
	<frameset cols="50%,50%">
		<frame name="a" src="/pages/nested-child.html" />
		<frame name="b" />
	</frameset>
</html>
