<!doctype html>
<title>CACHE</title>
<script>
	window.__cache = {};
	const twice = async (file, init) => {
		for (let i = 0; i < 2; i++)
			await (await fetch('/pages/' + file, init)).json();
	};
	(async () => {
		await twice('fresh.json');
		// the second request fires as soon as the first's headers arrive, while
		// its body is still being written to the store
		const first = await fetch('/pages/burst.json');
		const second = await fetch('/pages/burst.json');
		await Promise.all([first.json(), second.json()]);
		await twice('nostore.json');
		await twice('revalidate.json');
		await twice('auth.json', { headers: { authorization: 'Bearer x' } });
		await (
			await fetch('/pages/auth-other.json', {
				headers: { authorization: 'Bearer x' },
			})
		).json();
		await (
			await fetch('/pages/auth-other.json', {
				headers: { authorization: 'Bearer y' },
			})
		).json();
		__cache.hits = await (await fetch('/hits')).json();
	})()
		.catch((e) => {
			__cache.error = String(e);
		})
		.finally(() => {
			__cache.done = true;
		});
</script>
