<!doctype html>
<html>
	<head>
		<title>Slot content scripts</title>
		<script>
			document.documentElement.dataset.pageScript = 'ran';
			window.pageGlobal = 'page';
		</script>
		<script src="slot-cs.js"></script>
	</head>
	<body>
		<h1>slot content scripts</h1>
		<iframe id="same" src="slot-cs-frame.html?w=same"></iframe>
		<iframe id="excluded" src="slot-cs-excluded.html?w=excluded"></iframe>
		<script>
			// a frame of another site (another slot under the pool)
			const cross = document.createElement('iframe');
			cross.id = 'cross';
			cross.src = `${location.protocol}//localhost:${location.port}/pages/slot-cs-frame.html?w=cross`;
			document.body.append(cross);
		</script>
	</body>
</html>
