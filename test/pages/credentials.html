<!doctype html>
<title>CREDENTIALS</title>
<script>
	window.__cred = {};
	const cookies = async (init) =>
		(await (await fetch('/echo-headers', init)).json()).cookie ?? null;
	(async () => {
		await fetch('/pages/cred-set.json');
		__cred.defaultMode = await cookies();
		__cred.omit = await cookies({ credentials: 'omit' });
		__cred.sameOrigin = await cookies({ credentials: 'same-origin' });
		__cred.include = await cookies({ credentials: 'include' });
		// a Set-Cookie answered to an omit request is not stored
		await fetch('/pages/omit-set.json', { credentials: 'omit' });
		__cred.afterOmitSet = await cookies();
		// the proxy's own origin, routed: refused, never fetched
		const proxy = new URLSearchParams(location.search).get('proxy');
		const self = await fetch(`${proxy}/stomp/serviceWorker.js`);
		__cred.self = {
			status: self.status,
			text: (await self.text()).slice(0, 60),
		};
		const frame = document.createElement('iframe');
		frame.src = `${proxy}/`;
		document.body.append(frame);
		await new Promise((resolve) => {
			frame.onload = resolve;
			setTimeout(resolve, 4000);
		});
		__cred.selfFrame =
			frame.contentDocument?.body?.textContent?.slice(0, 60) ?? 'unreadable';
	})()
		.catch((error) => {
			__cred.error = String(error);
		})
		.finally(() => {
			__cred.done = true;
		});
</script>
