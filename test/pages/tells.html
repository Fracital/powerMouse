<!doctype html>
<title>TELLS</title>
<script>
	// the deployment's helper names: the defaults, or the four the suite
	// passed (`?names=access,client,globalProxy,globalName`)
	const helpers = (
		new URLSearchParams(location.search).get('names') || '$s$j,$P$s,$s$L,$s$N'
	).split(',');
	const names = (object) =>
		[...Object.getOwnPropertyNames(object), ...Reflect.ownKeys(object)]
			.filter((key) => typeof key === 'string')
			.filter((key) => helpers.includes(key));
	const asks = (object) =>
		helpers.filter(
			(key) =>
				Object.prototype.hasOwnProperty.call(object, key) ||
				Object.hasOwn(object, key) ||
				Reflect.has(object, key) ||
				Object.prototype.propertyIsEnumerable.call(object, key),
		);
	window.__tells = {
		windowNames: names(window),
		windowAsks: asks(window),
		locationNames: names(location),
		locationAsks: asks(location),
		evalNames: names(eval),
		evalAsks: asks(eval),
		documentNames: names(document),
		// documented tells, recorded, not asserted
		inOperator: helpers.filter((key) => key in window),
		prepare: typeof Error.prepareStackTrace,
		// the source of a rewritten function names the access helper
		functionSource: (() => location.href).toString(),
		// a page's own object answers natively
		plainHasOwn: Object.hasOwn({ [helpers[0]]: 1 }, helpers[0]),
		plainNames: Object.getOwnPropertyNames({ [helpers[1]]: 1 }),
		// the rewrite ran under these names: the real URL, the page as top
		rewritten: top === window && location.href,
	};
</script>
