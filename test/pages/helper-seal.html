<!doctype html>
<title>SEAL TOP</title>
<body>
	<script src="window-refs.js"></script>
	<script>
		// A page that frames another site and keeps a secret the child must not
		// reach through anything the proxy puts on its own window (the client,
		// the access API). With ?early the page reads the frame's contentWindow
		// before the child's document arrives, which injects this page's client
		// into the frame's initial about:blank (the child's document reuses it).
		// ?access names the access API (the controller mints it): the child
		// hunts with it as a page that learned it would
		window.sealSecret = 'SEAL-SECRET';
		const query = new URLSearchParams(location.search);
		const childQuery = new URLSearchParams();
		if (query.has('early')) childQuery.set('early', '');
		if (query.has('access')) childQuery.set('access', query.get('access'));
		const frame = document.createElement('iframe');
		frame.src = refsCross(
			`helper-seal-child.html${childQuery.size ? `?${childQuery}` : ''}`,
		);
		document.body.append(frame);
		if (query.has('early')) window.__early = frame.contentWindow;
	</script>
</body>
