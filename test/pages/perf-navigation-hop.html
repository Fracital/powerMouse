<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:," />
		<title>PERF NAVIGATION HOP</title>
	</head>
	<body>
		<script>
			// a document of the other origin on the way: the next one has no
			// same-origin document before it
			addEventListener('load', () =>
				setTimeout(() => {
					location.href = new URLSearchParams(location.search).get('next');
				}, 0),
			);
		</script>
	</body>
</html>
