<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>WINDOW GEOMETRY</title>
	</head>
	<body>
		<script>
			// The window's outer size and screen position, and how they relate
			// to the viewport: what a fingerprinting script reads to tell a real
			// window (a toolbar above the viewport) from a headless or
			// fullscreen one.
			// (a function too, so the suite can read a native window again)
			window.__measureGeometry = () => ({
				outer: [
					outerWidth,
					outerHeight,
					screenX,
					screenY,
					screenLeft,
					screenTop,
				].join(' '),
				toolbar: outerHeight > innerHeight,
				wider: outerWidth >= innerWidth,
			});
			window.__geometry = window.__measureGeometry();
		</script>
	</body>
</html>
