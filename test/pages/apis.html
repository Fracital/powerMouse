<!doctype html><title>APIS</title>
<script>
	window.__apis = { reload: typeof location.reload === 'function' };
	// an asynchronous XHR completes and names the real URL
	{
		const x = new XMLHttpRequest();
		x.open('GET', '/pages/fresh.json');
		x.onloadend = () => {
			__apis.xhrAsync = [x.status, x.responseURL, x.responseText.length > 0];
		};
		x.onerror = () => {
			__apis.xhrAsync = 'error';
		};
		x.send();
	}
	// history URLs: the page's own origin only, like the browser
	try {
		history.pushState(null, '', 'https://other.example/x');
		__apis.pushCross = 'no error';
	} catch (error) {
		__apis.pushCross = error.name;
	}
	try {
		history.replaceState(null, '', '/pages/apis.html?replaced');
		__apis.pushSame = location.search;
	} catch (error) {
		__apis.pushSame = error.name;
	}
	const req = indexedDB.open('mydb', 1);
	req.onsuccess = () => {
		__apis.idbName = req.result.name;
		req.result.close();
	};
	req.onerror = () => {
		__apis.idbName = 'error';
	};
	// a 3 MB upload, streamed from the page: every byte must reach the server
	let sent = 0;
	const total = 3 * 1024 * 1024;
	fetch('/echo-body', {
		method: 'POST',
		duplex: 'half',
		body: new ReadableStream({
			pull(controller) {
				if (sent >= total) return controller.close();
				const n = Math.min(65536, total - sent);
				controller.enqueue(new Uint8Array(n));
				sent += n;
			},
		}),
	})
		.then((r) => r.json())
		.then((j) => {
			__apis.upload = j.bytes;
		})
		.catch((e) => {
			__apis.upload = 'error ' + e.message;
		});
	fetch(new Request('/pages/echo.json', { method: 'POST', body: 'payload' }))
		.then((r) => r.json())
		.then((j) => {
			__apis.fetchRequest = j;
		})
		.catch((e) => {
			__apis.fetchRequest = 'error ' + e.message;
		});
</script>
