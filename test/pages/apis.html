<!doctype html><title>APIS</title>
<script>
	window.__apis = { reload: typeof location.reload === 'function' };
	// an asynchronous XHR completes and names the real URL
	{
		const x = new XMLHttpRequest();
		x.open('GET', '/pages/fresh.json');
		x.onloadend = () => {
			__apis.xhrAsync = [x.status, x.responseURL, x.responseText.length > 0];
		};
		x.onerror = () => {
			__apis.xhrAsync = 'error';
		};
		x.send();
	}
	// eval returns anything that is not a string unchanged; the generator
	// constructors run rewritten code like Function does
	{
		const object = { x: 1 };
		__apis.evalNonString = [
			eval(42) === 42,
			eval(object) === object,
			(0, eval)(object) === object,
			eval('6 * 7') === 42,
		];
		const Gen = Object.getPrototypeOf(function* () {}).constructor;
		const AsyncGen = Object.getPrototypeOf(async function* () {}).constructor;
		const gen = Gen('yield top === window; yield location.href');
		const made = [...gen()];
		__apis.generator = [
			made[0] === true,
			made[1] === location.href,
			Function.prototype.toString
				.call(Gen('yield 1'))
				.startsWith('function* anonymous('),
			typeof AsyncGen,
		];
	}
	// history URLs: the page's own origin only, like the browser
	try {
		history.pushState(null, '', 'https://other.example/x');
		__apis.pushCross = 'no error';
	} catch (error) {
		__apis.pushCross = error.name;
	}
	try {
		history.replaceState(null, '', '/pages/apis.html?replaced');
		__apis.pushSame = location.search;
	} catch (error) {
		__apis.pushSame = error.name;
	}
	const req = indexedDB.open('mydb', 1);
	req.onsuccess = () => {
		__apis.idbName = req.result.name;
		req.result.close();
	};
	req.onerror = () => {
		__apis.idbName = 'error';
	};
	// a 3 MB upload, streamed from the page: every byte must reach the server
	let sent = 0;
	const total = 3 * 1024 * 1024;
	fetch('/echo-body', {
		method: 'POST',
		duplex: 'half',
		body: new ReadableStream({
			pull(controller) {
				if (sent >= total) return controller.close();
				const n = Math.min(65536, total - sent);
				controller.enqueue(new Uint8Array(n));
				sent += n;
			},
		}),
	})
		.then((r) => r.json())
		.then((j) => {
			__apis.upload = j.bytes;
		})
		.catch((e) => {
			__apis.upload = 'error ' + e.message;
		});
	// a Request built from another Request keeps the URL (String(Request) is
	// "[object Request]", which once became a request for that path)
	try {
		const inner = new Request('/pages/echo.json?inner');
		const outer = new Request(inner, { method: 'POST' });
		__apis.requestFromRequest = [inner.url, outer.url, outer.method];
		fetch(new Request(outer))
			.then((r) => {
				__apis.fetchRequestFromRequest = [r.status, r.url];
			})
			.catch((e) => {
				__apis.fetchRequestFromRequest = 'error ' + e.message;
			});
	} catch (e) {
		__apis.requestFromRequest = 'error ' + e.message;
	}
	// fetch(request) fetches the request itself, whatever its JavaScript
	// members say: YouTube shadows a data: Request's `url` and `method` with
	// getters naming its player endpoint and checks that the data comes back
	// (a fetch that reads them is a patched one)
	const shadowed = (url) => {
		const request = new Request(url);
		Object.defineProperty(request, 'url', {
			get: () => `${location.origin}/pages/echo.json?shadowed`,
		});
		Object.defineProperty(request, 'method', { get: () => 'POST' });
		return request;
	};
	Promise.all([
		fetch(shadowed('data:application/json;base64,' + btoa('{"own":1}'))).then(
			(r) => r.json(),
		),
		fetch(shadowed('/pages/echo.json?own')).then((r) => r.url),
	])
		.then((results) => {
			__apis.fetchShadowedRequest = results;
		})
		.catch((e) => {
			__apis.fetchShadowedRequest = 'error ' + e.message;
		});
	fetch(new Request('/pages/echo.json', { method: 'POST', body: 'payload' }))
		.then((r) => r.json())
		.then((j) => {
			__apis.fetchRequest = j;
		})
		.catch((e) => {
			__apis.fetchRequest = 'error ' + e.message;
		});
</script>
