<!doctype html>
<title>SOP PARTITION</title>
<script>
	// Chrome's third-party partitioning (sop-partitions suite). The same site
	// (B) as a top-level page (`?role=top`) and as a frame in another site's
	// page (`?role=frame`): each writes to every store under its own name,
	// then reports what it reads of both, so the suite can tell which stores
	// the two share. A top-level page reports twice: before and after the
	// frame wrote (`?role=top&phase=after`). Its workers (dedicated, blob:
	// and shared) report what they see too, navigator.storage.estimate() how
	// much of the partition's storage it counts, and the service worker
	// registrations it has. A blob: and a `javascript:` document it makes say
	// which cookies their requests carry, and an image of site A (`?c=`) that
	// may be cached says whether the HTTP cache had it already.
	// `?role=nested` is B framed by A framed by B.
	(async () => {
		const query = new URLSearchParams(location.search);
		const role = query.get('role');
		const phase = query.get('phase') ?? 'before';
		// every name starts with the run's tag (`?t=`, read back as `p`), so
		// runs that share a browser's storage do not see each other
		const tag = query.get('t') ?? 'p';
		const mine = (name) =>
			name.startsWith(`${tag}-`) || name.startsWith(`${tag}_`);
		const shown = (names) =>
			names
				.filter(mine)
				.map((name) => `p${name.slice(tag.length)}`)
				.sort();
		const out = { role, phase };
		const settle = (promise, ms = 2000) =>
			Promise.race([
				promise,
				new Promise((resolve) => setTimeout(() => resolve('timeout'), ms)),
			]);
		// what each store holds is counted in units of this
		const UNIT = 64 * 1024;
		const write = async () => {
			localStorage.setItem(`${tag}-${role}`, '1');
			sessionStorage.setItem(`${tag}-${role}`, '1');
			document.cookie = `${tag}_${role}=1; path=/; SameSite=None; Secure`;
			document.cookie = `${tag}_${role}_chips=1; path=/; SameSite=None; Secure; Partitioned`;
			// and one the response sets
			await fetch(
				`/sop/r?k=part&cookie=${encodeURIComponent(
					`${tag}_${role}_http_chips=1; Path=/; SameSite=None; Secure; Partitioned`,
				)}`,
			);
			// and one another site's response sets for its request (`?x=`)
			const cross = query.get('x');
			if (cross)
				await fetch(
					`${cross}/sop/r?k=part&acao=${encodeURIComponent(location.origin)}&acac=1&cookie=${encodeURIComponent(
						`${tag}_${role}_cross_chips=1; Path=/; SameSite=None; Secure; Partitioned`,
					)}`,
					{ credentials: 'include' },
				);
			await new Promise((resolve) => {
				const open = indexedDB.open(`${tag}-${role}`);
				open.onsuccess = open.onerror = resolve;
			});
			const cache = await caches.open(`${tag}-${role}`);
			await cache.put(
				`/pages/sop-part-${tag}`,
				new Response(new Uint8Array(UNIT)),
			);
			const root = await navigator.storage.getDirectory();
			const file = await root.getFileHandle(`${tag}-${role}`, {
				create: true,
			});
			const writable = await file.createWritable();
			await writable.write(new Uint8Array(UNIT));
			await writable.close();
			// a service worker registration (scoped to a path no page here is at)
			await settle(
				navigator.serviceWorker.register('sop-part-sw.js', {
					scope: `${tag}-sw-${role}`,
				}),
				4000,
			);
		};
		const seenBy = (list) =>
			list && !list.error && typeof list === 'object'
				? Object.fromEntries(
						Object.entries(list).map(([store, names]) => [store, shown(names)]),
					)
				: list;
		const fromWorker = (worker) =>
			settle(
				new Promise((resolve) => {
					worker.onmessage = (event) => resolve(seenBy(event.data));
					worker.onerror = (event) => resolve(`error: ${event.message}`);
				}),
				4000,
			);
		// a document the page makes itself: the cookies its request carries
		// and those it reads
		const inlineSent = (kind) =>
			settle(
				new Promise((resolve) => {
					const report = (event) => {
						if (event.data?.inlineSent !== kind) return;
						removeEventListener('message', report);
						resolve({
							sent: shown(event.data.sent),
							cookies: shown(event.data.cookies),
						});
					};
					addEventListener('message', report);
					const script = `fetch(${JSON.stringify(
						`${location.origin}/sop/cookies`,
					)}).then((response) => response.json()).then((sent) => parent.postMessage({ inlineSent: ${JSON.stringify(
						kind,
					)}, sent, cookies: document.cookie.split('; ').map((pair) => pair.split('=')[0]) }, '*'));`;
					const html = `<!doctype html><script>${script}<\/script>`;
					const frame = document.createElement('iframe');
					frame.src =
						kind === 'blob'
							? URL.createObjectURL(new Blob([html], { type: 'text/html' }))
							: `javascript:${encodeURIComponent(JSON.stringify(html))}`;
					document.body.append(frame);
				}),
				4000,
			);
		// a resource of site A that may be kept for an hour, as an image
		// (which the renderer's memory cache may answer) and with fetch (the
		// HTTP cache only): how many of its loads reached the site so far,
		// from every step of the run
		const cachedLoad = async (kind) => {
			const site = query.get('c');
			if (!site) return null;
			const k = `${tag}-cache-${kind}`;
			const url = `${site}/sop/r?k=${k}&type=png&acao=*&cc=${encodeURIComponent(
				'max-age=3600',
			)}`;
			if (kind === 'fetch') await (await fetch(url)).arrayBuffer();
			else
				await new Promise((resolve) => {
					const image = new Image();
					image.onload = image.onerror = resolve;
					image.src = url;
				});
			return (await (await fetch(`${site}/sop/log?k=${k}`)).json()).length;
		};
		const read = async () => {
			const opfs = [];
			for await (const name of (await navigator.storage.getDirectory()).keys())
				opfs.push(name);
			const estimate = await navigator.storage.estimate();
			const units = (bytes) => Math.round((bytes ?? 0) / UNIT);
			return {
				localStorage: shown(Object.keys(localStorage)),
				cookies: shown(
					document.cookie.split('; ').map((pair) => pair.split('=')[0]),
				),
				sent: shown(await (await fetch('/sop/cookies')).json()),
				databases: shown(
					(await indexedDB.databases()).map((info) => info.name),
				),
				caches: shown(await caches.keys()),
				opfs: shown(opfs),
				locks: shown(
					(await navigator.locks.query()).held.map((lock) => lock.name),
				),
				registrations: shown(
					(await navigator.serviceWorker.getRegistrations()).map(
						(registration) =>
							new URL(registration.scope).pathname.split('/').pop(),
					),
				),
				// the partition's own: a unit per role that wrote to it
				estimate: {
					caches: units(estimate.usageDetails?.caches),
					fileSystem: units(estimate.usageDetails?.fileSystem),
				},
			};
		};
		try {
			if (phase === 'before') {
				await write();
				// a lock held as long as the page lives
				navigator.locks.request(`${tag}-${role}`, () => new Promise(() => {}));
			}
			// the channel: what each hears of the other within a second
			const channel = new BroadcastChannel(`${tag}-channel`);
			const heard = new Set();
			channel.onmessage = (event) => heard.add(event.data);
			const say = setInterval(() => channel.postMessage(role), 100);
			// a shared worker counts the documents that connected to it
			const worker = new SharedWorker('sop-part-worker.js', `${tag}-worker`);
			const ask = (what) =>
				settle(
					new Promise((resolve) => {
						worker.port.onmessage = (event) => resolve(event.data);
						worker.port.postMessage(what);
					}),
				);
			out.workerCount = await ask('count');
			// what each kind of worker sees of the stores: the document's
			// partition, which it takes on before its own script runs
			const blobSource = `importScripts(${JSON.stringify(
				new URL('sop-part-list.js', location.href).href,
			)}); self.listStores().then(postMessage, (error) => postMessage({ error: String(error) }));`;
			out.workers = {
				dedicated: await fromWorker(new Worker('sop-part-dedicated.js')),
				blob: await fromWorker(
					new Worker(URL.createObjectURL(new Blob([blobSource]))),
				),
				shared: seenBy(await ask('seen')),
			};
			out.inline = {
				blob: await inlineSent('blob'),
				javascript: await inlineSent('javascript'),
			};
			out.cacheLoads = {
				image: await cachedLoad('image'),
				fetch: await cachedLoad('fetch'),
			};
			await new Promise((resolve) => setTimeout(resolve, 1000));
			clearInterval(say);
			out.heard = [...heard].sort();
			out.seen = await read();
		} catch (error) {
			out.error = `${error.name}: ${error.message}`;
		}
		out.done = true;
		window.__part = out;
		if (parent !== window) parent.postMessage({ sopPart: out }, '*');
	})();
</script>
