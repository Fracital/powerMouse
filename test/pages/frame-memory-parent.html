<!doctype html>
<html>
	<head>
		<title>frame memory, parent</title>
		<style>
			body {
				margin: 0;
			}
			.pixel {
				background: url(/pages/frame-memory.html?bg);
			}
		</style>
	</head>
	<body>
		<div class="pixel">x</div>
		<script>
			// what a cookie-sync or ad frame runs: one inline script
			(function () {
				var image = document.createElement('img');
				image.width = 1;
				image.height = 1;
				image.src = '/pages/frame-memory.html?sync=' + Math.random();
				document.body.appendChild(image);
				// and what an ad frame does with the page it is in: reads its
				// parent and top and posts to its parent (with the site pool, a
				// frame of another site reads and posts to a window of another
				// slot)
				if (parent !== top) throw new Error('not a frame of the top');
				parent.postMessage({ frameMemory: location.search }, '*');
				window.__ranAt = performance.now();
			})();
		</script>
	</body>
</html>
