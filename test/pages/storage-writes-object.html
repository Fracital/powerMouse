<!doctype html>
<title>storage writes: object</title>
<script>
	// an <object>'s document (whose bundle runs at a blob: URL through the
	// proxy) writes and reads back what it wrote
	const prefix = new URLSearchParams(location.search).get('p') ?? 'sw';
	let read;
	try {
		localStorage.setItem(`${prefix}object`, 'from an object');
		localStorage.removeItem(`${prefix}k0`);
		read = [
			localStorage.getItem(`${prefix}object`),
			localStorage.getItem(`${prefix}k0`),
		];
	} catch (error) {
		read = `threw ${error.name}`;
	}
	parent.postMessage({ object: prefix, read }, '*');
</script>
