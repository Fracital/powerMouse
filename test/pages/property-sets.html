<!doctype html>
<title>PROPERTY SETS</title>
<script>
	// every URL property a page sets, on a detached element and on one in the
	// document, each marked ?prop=<kind>-<where>
	const at = (file, mark) =>
		new URL(`${file}?prop=${mark}`, location.href).href;
	const sets = [
		['img', 'src', 'blank-pixel.svg'],
		['img', 'srcset', 'blank-pixel.svg', (url) => `${url} 1x`],
		['input', 'src', 'blank-pixel.svg', null, { type: 'image' }],
		['video', 'poster', 'blank-pixel.svg'],
		['audio', 'src', 'echo.json'],
		['video', 'src', 'echo.json'],
		['source', 'srcset', 'blank-pixel.svg', (url) => `${url} 1x`],
		['script', 'src', 'blank-script.js'],
		['link', 'href', 'blank.css', null, { rel: 'stylesheet' }],
		['iframe', 'src', 'blank-pixel.svg'],
		['embed', 'src', 'blank-pixel.svg'],
		['object', 'data', 'blank-pixel.svg'],
		['track', 'src', 'hdr.json'],
	];
	addEventListener('load', () => {
		for (const where of ['detached', 'connected'])
			for (const [tag, property, file, wrap, attributes] of sets) {
				const element = document.createElement(tag);
				for (const [name, value] of Object.entries(attributes ?? {}))
					element[name] = value;
				if (where === 'connected')
					(tag === 'source'
						? document.createElement('picture')
						: document.body
					).append(element);
				const url = at(file, `${tag}-${property}-${where}`);
				element[property] = wrap ? wrap(url) : url;
			}
		const image = new Image();
		image.src = at('blank-pixel.svg', 'image-object');
		// ?read: the markup is read back every way a page can, after its own
		// loads are in; the reads must load nothing at all
		if (location.search.includes('read'))
			setTimeout(() => {
				const holder = document.createElement('div');
				holder.innerHTML = `<img src="${at('blank-pixel.svg', 'read-img')}"><img srcset="${at('blank-pixel.svg', 'read-srcset')} 1x"><link rel="stylesheet" href="${at('blank.css', 'read-link')}">`;
				const template = document.createElement('template');
				template.innerHTML = `<img src="${at('blank-pixel.svg', 'read-template')}">`;
				holder.append(template);
				const host = document.createElement('div');
				host.attachShadow({ mode: 'open' }).innerHTML =
					`<img src="${at('blank-pixel.svg', 'read-shadow')}">`;
				holder.append(host);
				document.body.append(holder);
				// the page's own loads first, then a quiet moment to read in
				setTimeout(() => {
					window.__readStarted = true;
					window.__read = [
						document.body.innerHTML.length,
						holder.outerHTML.length,
						typeof holder.getHTML === 'function'
							? holder.getHTML({ serializableShadowRoots: true }).length
							: 0,
						new XMLSerializer().serializeToString(holder).length,
						template.innerHTML.length,
						host.shadowRoot.innerHTML.length,
					];
				}, 1500);
			}, 300);
		setTimeout(() => (window.__propertySets = { done: true }), 2000);
	});
</script>
