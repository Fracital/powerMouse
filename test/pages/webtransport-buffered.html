<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>WEBTRANSPORT BUFFERED</title>
	</head>
	<body>
		<script>
			// An upload on a WebTransport stream as a speed test sends one,
			// against the webtransport-buffered suite's server (?port, ?hash),
			// whose uplink is slow: 64 KiB writes, each once the writer is
			// ready, and how many bytes the page's writes had settled (what a
			// page counts as uploaded) at each mark (?marks, ms), then how
			// long until the server had read every byte. window.__wt holds
			// the answer.
			const params = new URLSearchParams(location.search);
			const bytes = (hex) =>
				Uint8Array.from(hex.match(/../g), (pair) => parseInt(pair, 16));
			const total = Number(params.get('bytes'));
			const marks = params.get('marks').split(',').map(Number);
			(async () => {
				const url = `https://127.0.0.1:${params.get('port')}/slow?delay=0&run=${params.get('run')}`;
				const t = new WebTransport(url, {
					serverCertificateHashes: [
						{ algorithm: 'sha-256', value: bytes(params.get('hash')) },
					],
				});
				await t.ready;
				const s = await t.createBidirectionalStream();
				const w = s.writable.getWriter();
				const chunk = new Uint8Array(65536).fill(7);
				let settled = 0;
				const at = [];
				const start = performance.now();
				const timers = marks.map((mark, i) =>
					setTimeout(() => (at[i] = settled), mark),
				);
				for (let written = 0; written < total; written += chunk.length) {
					await w.ready;
					w.write(chunk).then(() => (settled += chunk.length));
				}
				await w.close();
				const reader = s.readable.getReader();
				let answer = '';
				for (;;) {
					const { value, done } = await reader.read();
					if (done) break;
					answer += new TextDecoder().decode(value);
				}
				const ms = Math.round(performance.now() - start);
				for (const timer of timers) clearTimeout(timer);
				t.close();
				return { at, ms, counted: Number(answer) };
			})().then(
				(result) => (window.__wt = { run: params.get('run'), result }),
				(error) =>
					(window.__wt = { run: params.get('run'), result: String(error) }),
			);
		</script>
	</body>
</html>
