	// `super.postMessage.call(this, m)` asks for the parent's method: a
	// rewrite that posts to `this` would call the subclass's own
	P('super.postMessage.call(this) is the parent method', () => {
		class Base {
			postMessage(m) {
				return 'parent';
			}

		class Sub extends Base {
			postMessage(m) {
				return 'TELL:own';
			}
			send(m) {
				return [
					super.postMessage.call(this, m),
					super.postMessage.apply(this, [m]),
