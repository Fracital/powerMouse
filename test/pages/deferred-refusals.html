<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>deferred refusals</title>
	</head>
	<body>
		<script>
			// The child the suite deferred-refusals asks: it makes, in a realm
			// of its own, the calls whose code is a deferred part of the
			// document bundle, and posts what each did. `calls` names them.
			window.__child = (calls) => {
				const frame = document.createElement('iframe');
				const answer = new Promise((resolve) => {
					addEventListener('message', (event) => {
						if (event.source === frame.contentWindow) resolve(event.data);
					});
					setTimeout(() => resolve({ error: 'no answer' }), 20000);
				});
				frame.src = `deferred-refusals-child.html#${calls.join(',')}`;
				document.body.append(frame);
				return answer;
			};
		</script>
	</body>
</html>
