<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>FIELD ORDER</title>
	</head>
	<body>
		<script>
			// Cross-origin CORS loads of each kind to the suite's recorder
			// (?r=<origin>), which keeps the field names in the order they came:
			// a fetch and an XHR (Origin from the network stack, after Accept),
			// a POST, a module script and a crossorigin image (Origin from
			// Blink, first).
			const recorder = new URLSearchParams(location.search).get('r');
			const run = new URLSearchParams(location.search).get('run');
			const at = (kind) => `${recorder}/record?k=${run}-${kind}`;
			const load = (element, attributes) =>
				new Promise((resolve) => {
					const el = document.createElement(element);
					el.onload = el.onerror = () => resolve();
					for (const [k, v] of Object.entries(attributes))
						el.setAttribute(k, v);
					document.body.append(el);
				});
			(async () => {
				await fetch(at('fetch')).catch(() => {});
				await fetch(at('post'), { method: 'POST', body: 'x' }).catch(() => {});
				await new Promise((resolve) => {
					const xhr = new XMLHttpRequest();
					xhr.open('GET', at('xhr'));
					xhr.onloadend = resolve;
					xhr.send();
				});
				// fields the page sets itself: Blink keeps them in its header map
				// with the page's others, where the defaults come later (Accept
				// after the map, Accept-Language from the network stack,
				// Cache-Control and Pragma first for a cache mode)
				await fetch(at('page-accept'), {
					headers: { accept: 'application/json' },
				}).catch(() => {});
				await fetch(at('page-language'), {
					headers: { 'accept-language': 'de' },
				}).catch(() => {});
				await fetch(at('page-cache'), {
					headers: { 'cache-control': 'no-cache', pragma: 'no-cache' },
				}).catch(() => {});
				await fetch(at('page-many'), {
					headers: {
						'x-o-mart': 'B2C',
						'x-o-segment': 'oaoh',
						traceparent: '00-18e8f5f8-00',
						'content-type': 'application/json',
						'tenant-id': 'elh9ie',
						'x-o-platform': 'rweb',
						accept: 'application/json',
						'x-request-id': 'r-1',
					},
				}).catch(() => {});
				await new Promise((resolve) => {
					const xhr = new XMLHttpRequest();
					xhr.open('GET', at('page-xhr'));
					xhr.setRequestHeader('Accept', 'application/json');
					xhr.setRequestHeader('Accept-Language', 'de');
					xhr.onloadend = resolve;
					xhr.send();
				});
				await load('script', { type: 'module', src: at('module') });
				await load('img', { crossorigin: 'anonymous', src: at('image') });
				window.__fieldOrder = true;
			})();
		</script>
	</body>
</html>
