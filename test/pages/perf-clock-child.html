<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:," />
		<title>PERF CLOCK CHILD</title>
	</head>
	<body>
		<script>
			const report = () =>
				parent.postMessage(
					{
						perfClock: new URLSearchParams(location.search).get('n'),
						record: {
							timeOrigin: performance.timeOrigin,
							now: performance.now(),
							date: Date.now(),
							used: performance.memory && performance.memory.usedJSHeapSize,
							limit: performance.memory && performance.memory.jsHeapSizeLimit,
							navigation: performance
								.getEntriesByType('navigation')
								.map((entry) => `${entry.type}`)
								.join(),
						},
					},
					'*',
				);
			report();
			// asked again later: a figure of the same moment as its parent's
			addEventListener('message', (event) => {
				if (event.data === 'perfClockAgain') report();
			});
		</script>
	</body>
</html>
