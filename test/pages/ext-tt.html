<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>trusted types target</title>
		<script>
			// what the first script of the page sees: document_start ran before it
			window.__pageFirst = {
				start: document.documentElement.dataset.start || null,
				main: window.__mainRan || null,
				storage: typeof (window.chrome && window.chrome.storage),
				runtimeId: typeof (
					window.chrome &&
					window.chrome.runtime &&
					window.chrome.runtime.id
				),
			};
			// the page's own string write, which its Trusted Types refuse; and
			// the violations (an isolated world's writes make none)
			window.__violations = 0;
			window.__violationList = [];
			document.addEventListener('securitypolicyviolation', (event) => {
				window.__violations++;
				window.__violationList.push(
					`${event.violatedDirective} ${event.sample}`.slice(0, 120),
				);
			});
			try {
				document.createElement('div').innerHTML = '<i>page</i>';
				window.__ownWrite = 'written';
			} catch (error) {
				window.__ownWrite = 'refused';
			}
		</script>
	</head>
	<body>
		<p id="target">target</p>
		<script>
			window.__bodyScript = true;
		</script>
	</body>
</html>
