# Lint, type-check, format-check and build on every push and pull request.
#
# Security posture (keep it this way):
# - `pull_request`, never `pull_request_target`: a PR's code runs with a
#   read-only token for the PR's own merge commit, with no secrets, and this
#   workflow never writes anything back (no auto-format commits). PRs that
#   fail formatting fail the check and the author runs `npm run format`.
# - `permissions: contents: read` at the top level; no job raises it.
# - Actions are pinned to commit SHAs, not tags. Dependabot keeps them fresh.
# - `npm ci --ignore-scripts`: a PR cannot run code at install time.
# - Untrusted values (titles, bodies, branch names) are never interpolated
#   into `run:` scripts; only SHAs are, through `env`.
# - The repository is configured to require approval before workflows run
#   for first-time outside contributors (see AGENTS.md, "CI").

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A push to master is never cancelled: GitHub shows a cancelled run as a
# failed check on its commit. Each push gets a group of its own, and a job
# whose commit is no longer master's head skips its work and passes
# ("superseded", see the first step of each job). Pull requests still cancel
# their older runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: lint, types, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.superseded != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.superseded != 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install (no lifecycle scripts)
        if: steps.head.outputs.superseded != 'true'
        run: npm ci --ignore-scripts

      - name: Type check
        if: steps.head.outputs.superseded != 'true'
        run: npm run check

      - name: Lint
        if: steps.head.outputs.superseded != 'true'
        run: npm run lint

      - name: Format check
        if: steps.head.outputs.superseded != 'true'
        run: npx prettier --check .

      - name: Prose check (no em dashes, no AI attribution in docs)
        if: steps.head.outputs.superseded != 'true'
        run: npm run check:prose

      - name: Build
        if: steps.head.outputs.superseded != 'true'
        run: node build.js && test -f dist/serviceWorker.js && test -f dist/controller.mjs

      # the same tree builds byte-identical files, none naming the checkout's
      # path, so a hashed file (the document bundle, the rewriter library)
      # keeps its hash until what it is built from changes
      - name: Reproducible build
        if: steps.head.outputs.superseded != 'true'
        run: node scripts/check-reproducible.mjs

      # the published declarations compile in a consumer under
      # moduleResolution nodenext, node16 and bundler (after the reproducible
      # build, which empties dist/)
      - name: Declarations
        if: steps.head.outputs.superseded != 'true'
        run: npx tsc -p tsconfig.types.json && node scripts/types-extensions.mjs && npm run check:types

      # the rewriter on the minified shapes real sites broke it with
      # (test/corpus/sample; the rewrite-corpus suite runs the same check)
      - name: Rewrite corpus sample
        if: steps.head.outputs.superseded != 'true'
        run: node test/corpus/check.mjs --minify test/corpus/sample

  # The WebRTC stack's own tests (rust/rtc: str0m as patched, two peers
  # over a fake network), which the wasm build does not run: cargo test in
  # the Rust image deploy/rust/pins.env pins by digest, with the patched
  # crates made as deploy/rust/patches.sh makes them. About 3 minutes from
  # cold (image, crates, debug build, the tests themselves 27 s), beside
  # the browser suites.
  rust:
    name: rust tests (rtc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.superseded != 'true'
        with:
          persist-credentials: false

      # (the checkout is read-only in the container: the crates are patched
      # and built in a copy of it)
      - name: cargo test -p rtc
        if: steps.head.outputs.superseded != 'true'
        run: |
          source deploy/rust/pins.env
          docker run --rm -v "$PWD:/src:ro" "$RUST_IMAGE" bash -c '
            set -euo pipefail
            mkdir -p /work
            cp -r /src/rust /work/rust
            rm -rf /work/rust/target /work/rust/patched
            bash /src/deploy/rust/patches.sh
            cd /work/rust
            cargo test --locked -p rtc'

  # test262 natively and rewritten (test/test262/run.mjs), gated by
  # test/test262/known.txt, which names the test262 commit it was recorded
  # at: that commit is the one fetched (test/ and harness/ only, cached by
  # its sha), so a new pin is a change of known.txt.
  test262:
    name: test262 differential
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.superseded != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.superseded != 'true'
        with:
          node-version: 24
          cache: npm

      - name: test262 commit
        id: pin
        if: steps.head.outputs.superseded != 'true'
        run: |
          sha=$(grep -m1 -oE 'test262 [0-9a-f]{40}' test/test262/known.txt | cut -d' ' -f2)
          [[ -n $sha ]] || { echo "::error::test/test262/known.txt names no test262 commit"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        if: steps.head.outputs.superseded != 'true'
        with:
          path: ${{ runner.temp }}/test262
          key: test262-${{ steps.pin.outputs.sha }}

      - name: Fetch test262
        if: steps.head.outputs.superseded != 'true' && steps.cache.outputs.cache-hit != 'true'
        env:
          SHA: ${{ steps.pin.outputs.sha }}
          DIR: ${{ runner.temp }}/test262
        run: |
          mkdir -p "$DIR"
          curl -fsSL --retry 3 "https://codeload.github.com/tc39/test262/tar.gz/$SHA" |
            tar -xz -C "$DIR" --strip-components=1 \
              "test262-$SHA/harness" "test262-$SHA/test/language" \
              "test262-$SHA/test/built-ins" "test262-$SHA/test/annexB"

      - name: Install (no lifecycle scripts)
        if: steps.head.outputs.superseded != 'true'
        run: npm ci --ignore-scripts

      - name: Build
        if: steps.head.outputs.superseded != 'true'
        run: node build.js

      - name: test262
        if: steps.head.outputs.superseded != 'true'
        env:
          TEST262: ${{ runner.temp }}/test262
          NO_COLOR: '1'
        run: npm run test262 -- --jobs 4

      - name: Gate (test/test262/known.txt)
        if: steps.head.outputs.superseded != 'true'
        run: npm run test262:report

  # Browser suites on the runner's Chrome. Fixture-based suites only
  # (SKIP_NETWORK leaves out the ones that drive Wikipedia and the public
  # HTTP/3 servers, SKIP_MEASUREMENT the measure-* timings, SKIP_TIMING the
  # checks that read pointer timing); no secrets, read only.
  browser:
    name: browser suites (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    # the adversarial corpus (about 9 minutes) runs as a job of its own, and
    # the rest (about 290 minutes of suites, PARALLEL=2 each) as ten shards
    # beside it, cut by test/suite-seconds.json so they end together: about
    # 15 minutes each (six took 25 to 33). Eleven jobs at two suites each are
    # what a 28-core machine runs side by side before the suites slow down
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: main 1, suites: '!adversarial-', shard: 1/10 }
          - { name: main 2, suites: '!adversarial-', shard: 2/10 }
          - { name: main 3, suites: '!adversarial-', shard: 3/10 }
          - { name: main 4, suites: '!adversarial-', shard: 4/10 }
          - { name: main 5, suites: '!adversarial-', shard: 5/10 }
          - { name: main 6, suites: '!adversarial-', shard: 6/10 }
          - { name: main 7, suites: '!adversarial-', shard: 7/10 }
          - { name: main 8, suites: '!adversarial-', shard: 8/10 }
          - { name: main 9, suites: '!adversarial-', shard: 9/10 }
          - { name: main 10, suites: '!adversarial-', shard: 10/10 }
          - { name: adversarial, suites: 'adversarial-', shard: '' }
    # the longest suites take 9 to 11 minutes alone (wpt-navigation-api,
    # top-navigation, csp-navigation); a suite that failed runs once more
    # alone after the others and needs room for it
    timeout-minutes: 70
    steps:
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.superseded != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.superseded != 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.head.outputs.superseded != 'true'
        run: npm ci --ignore-scripts

      # the bundles and the offline page the suites load; the type check and
      # the declarations `npm run build` adds are the check job's (half a
      # minute of every shard's)
      - name: Build
        if: steps.head.outputs.superseded != 'true'
        run: node build.js && npm run build:offline

      # which Chrome gates this push: the runner image updates it on its own
      - name: Chrome version
        if: steps.head.outputs.superseded != 'true'
        env:
          CHROME: /usr/bin/google-chrome
        run: '"$CHROME" --version'

      - name: Browser suites
        if: steps.head.outputs.superseded != 'true'
        env:
          CHROME: /usr/bin/google-chrome
          SKIP_NETWORK: '1'
          SKIP_TIMING: '1'
          SKIP_MEASUREMENT: '1'
          PARALLEL: '2'
          SUITES: ${{ matrix.group.suites }}
          SHARD: ${{ matrix.group.shard }}
          NO_COLOR: '1'
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # on a push, a newer commit on master mid-run stops the suites and
        # the job passes as superseded
        run: |
          if [[ $GITHUB_EVENT_NAME != push ]]; then exec npm test; fi
          setsid -w npm test &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            for _ in $(seq 1 15); do
              kill -0 "$pid" 2>/dev/null || break 2
              sleep 2
            done
            head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || continue
            if [[ $head != "$GITHUB_SHA" ]]; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              echo "::notice::superseded by $head mid-run, stopped"
              exit 0
            fi
          done
          wait "$pid"

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: No AI attribution in commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-prose.mjs --commits "$BASE_SHA" "$HEAD_SHA"
