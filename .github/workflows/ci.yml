# Lint, type-check, format-check and build on every push and pull request.
#
# Security posture (keep it this way):
# - `pull_request`, never `pull_request_target`: a PR's code runs with a
#   read-only token for the PR's own merge commit, with no secrets, and this
#   workflow never writes anything back (no auto-format commits). PRs that
#   fail formatting fail the check and the author runs `npm run format`.
# - `permissions: contents: read` at the top level; no job raises it.
# - Actions are pinned to commit SHAs, not tags. Dependabot keeps them fresh.
# - `npm ci --ignore-scripts`: a PR cannot run code at install time.
# - Untrusted values (titles, bodies, branch names) are never interpolated
#   into `run:` scripts; only SHAs are, through `env`.
# - The repository is configured to require approval before workflows run
#   for first-time outside contributors (see AGENTS.md, "CI").

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A push to master is never cancelled: GitHub shows a cancelled run as a
# failed check on its commit. Each push gets a group of its own, and a job
# whose commit is no longer master's head skips its work and passes
# ("superseded", see the first step of each job). Pull requests still cancel
# their older runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: lint, types, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.superseded != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.superseded != 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install (no lifecycle scripts)
        if: steps.head.outputs.superseded != 'true'
        run: npm ci --ignore-scripts

      - name: Type check
        if: steps.head.outputs.superseded != 'true'
        run: npm run check

      - name: Lint
        if: steps.head.outputs.superseded != 'true'
        run: npm run lint

      - name: Format check
        if: steps.head.outputs.superseded != 'true'
        run: npx prettier --check .

      - name: Prose check (no em dashes, no AI attribution in docs)
        if: steps.head.outputs.superseded != 'true'
        run: npm run check:prose

      - name: Build
        if: steps.head.outputs.superseded != 'true'
        run: node build.js && test -f dist/serviceWorker.js && test -f dist/controller.mjs

  # Browser suites on the runner's Chrome. Fixture-based suites only
  # (SKIP_NETWORK leaves out the ones that drive Wikipedia); no secrets, read
  # only, not required by branch protection until it has proven stable.
  browser:
    name: browser suites
    runs-on: ubuntu-latest
    # a clean run takes about 40 minutes (cross-origin-isolation alone takes
    # about 15, visited about 3); a suite that failed runs once more alone
    # after the others and needs room for it
    timeout-minutes: 70
    steps:
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.superseded != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.superseded != 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.head.outputs.superseded != 'true'
        run: npm ci --ignore-scripts

      - name: Build
        if: steps.head.outputs.superseded != 'true'
        run: npm run build

      - name: Browser suites
        if: steps.head.outputs.superseded != 'true'
        env:
          CHROME: /usr/bin/google-chrome
          STOMP_REWRITER: wasm
          SKIP_NETWORK: '1'
          SKIP_TIMING: '1'
          SKIP_MEASUREMENT: '1'
          PARALLEL: '2'
          NO_COLOR: '1'
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # on a push, a newer commit on master mid-run stops the suites and
        # the job passes as superseded
        run: |
          if [[ $GITHUB_EVENT_NAME != push ]]; then exec npm test; fi
          setsid -w npm test &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            for _ in $(seq 1 15); do
              kill -0 "$pid" 2>/dev/null || break 2
              sleep 2
            done
            head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || continue
            if [[ $head != "$GITHUB_SHA" ]]; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              echo "::notice::superseded by $head mid-run, stopped"
              exit 0
            fi
          done
          wait "$pid"

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: No AI attribution in commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-prose.mjs --commits "$BASE_SHA" "$HEAD_SHA"
