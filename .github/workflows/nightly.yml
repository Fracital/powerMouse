# Publish master to npm as @sysce/stomp@nightly, once a night and on manual
# dispatch. Only a commit whose CI passed is published, and only once.
#
# Same posture as ci.yml: pinned actions and no pull_request trigger. npm
# trusted publishing authenticates this workflow (OIDC, `id-token: write`; the
# trust is set on npmjs.com for Fracital/powerMouse and nightly.yml), and the
# package carries provenance. Those repos hear of a new nightly right away
# by a push to their stomp-signal branch whose commit message is the
# version, made with a deploy key of each (secrets SYSTEMYA_SIGNAL_KEY and
# FRACITAL_SIGNAL_KEY; their schedules never fire). STOMP_DISPATCH_TOKEN (a
# token limited to the two repos, Contents read and write) sends a
# repository_dispatch as well when it is set. Every secret is optional.

name: Nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  checks: read
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # the blocker's engine snapshot (assets/adblock-snapshot.dat.gz,
  # docs/adblock.md "The snapshot") is made by hand from lists that change
  # every day: this run fails, every night until it is made again, once its
  # lists are more than 14 days old or it was made by another blocker.wasm
  # (the build refuses that one too). It does not hold the publish: an old
  # snapshot still serves, only until the worker's own build of the lists
  snapshot:
    name: adblock snapshot is fresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Snapshot fresh?
        run: |
          node scripts/adblock-snapshot.mjs --check 2>check.txt || {
            echo "::error file=assets/adblock-snapshot.UPSTREAM::$(cat check.txt)"
            exit 1
          }

  publish:
    name: publish @sysce/stomp@nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or newer
      - name: npm for trusted publishing
        run: npm install -g npm@11.13.0

      - name: Not published yet?
        id: fresh
        run: |
          commit=$(node scripts/nightly-version.mjs --commit)
          if npm view @sysce/stomp versions --json 2>/dev/null | grep -q "\.$commit\""; then
            echo "::notice::$commit is published already"
            echo publish=false >>"$GITHUB_OUTPUT"
          else
            echo publish=true >>"$GITHUB_OUTPUT"
          fi

      # CI on this commit must have run its suites and passed (not been
      # superseded); wait for it while it runs, up to 45 minutes
      - name: CI passed on this commit
        if: steps.fresh.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 90); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.id)"')
            read -r status conclusion id <<<"$run"
            if [[ $status == completed ]]; then
              [[ $conclusion == success ]] || { echo "::error::CI on $sha: $conclusion"; exit 1; }
              # a superseded job passes too; its notice is an annotation
              for job in $(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '.jobs[].id'); do
                if gh api "repos/$REPO/check-runs/$job/annotations" --jq '.[].message' | grep -q '^superseded'; then
                  echo "::error::CI on $sha was superseded, not run"; exit 1
                fi
              done
              exit 0
            fi
            sleep 30
          done
          echo "::error::CI on $sha did not finish in 45 minutes"
          exit 1

      - name: Install
        if: steps.fresh.outputs.publish == 'true'
        run: npm ci --ignore-scripts

      - name: Publish
        id: publish
        if: steps.fresh.outputs.publish == 'true'
        run: |
          version=$(node scripts/nightly-version.mjs)
          npm version "$version" --no-git-tag-version
          npm publish --tag nightly --provenance --access public
          echo "::notice::published @sysce/stomp@$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # tell the sites that vendor STomp, so they update now instead of on
      # their schedule (their stomp-update.yml takes repository_dispatch
      # stomp-nightly with client_payload.version)
      - name: Tell SystemYA and Fracital
        if: steps.fresh.outputs.publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.STOMP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          if [[ -z $GH_TOKEN ]]; then
            echo "::warning::STOMP_DISPATCH_TOKEN is not set; the stomp-signal push tells the downstream repos"
            exit 0
          fi
          for repo in Fracital/SystemYA Fracital/Fracital; do
            gh api "repos/$repo/dispatches" -f event_type=stomp-nightly -f "client_payload[version]=$VERSION" \
              || echo "::warning::could not dispatch to $repo"
          done

      - name: Signal SystemYA and Fracital
        if: steps.fresh.outputs.publish == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.publish.outputs.version }}
          SYSTEMYA_KEY: ${{ secrets.SYSTEMYA_SIGNAL_KEY }}
          FRACITAL_KEY: ${{ secrets.FRACITAL_SIGNAL_KEY }}
        run: |
          set -u
          # an empty commit on the repo's stomp-signal branch, its message the
          # version (the updaters check it against a semver pattern); a push
          # by a deploy key starts that repo's workflows
          signal() { # repo key
            local dir key
            dir=$(mktemp -d)
            key="$dir/key"
            printf '%s\n' "$2" >"$key"
            chmod 600 "$key"
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git clone -q --depth 1 --branch main "git@github.com:$1.git" "$dir/r" &&
              git -C "$dir/r" -c user.name="powerMouse nightly" -c user.email="nightly@users.noreply.github.com" \
                commit -q --allow-empty -m "$VERSION" &&
              git -C "$dir/r" push -q -f origin HEAD:refs/heads/stomp-signal ||
              echo "::warning::could not signal $1"
            rm -rf "$dir"
          }
          if [[ -n ${SYSTEMYA_KEY:-} ]]; then signal Fracital/SystemYA "$SYSTEMYA_KEY"; fi
          if [[ -n ${FRACITAL_KEY:-} ]]; then signal Fracital/Fracital "$FRACITAL_KEY"; fi
          exit 0
