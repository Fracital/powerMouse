# Build every push to master, then deploy it to terp (5.188.124.62) as https://stomp.fracit.al/.
#
# TERP_DEPLOY_KEY is an SSH key that terp pins to /usr/local/sbin/stomp-deploy-gate (source:
# deploy/terp-deploy-gate.sh, installed by hand, CI never updates it). The only command it accepts
# is `deploy <sha>`: terp fetches that commit from GitHub, runs npm ci + build in /opt/stomp/stage,
# swaps /opt/stomp/repo to it, restarts pm2 `stomp`, health-checks :8081 and rolls back on failure.
# It refuses to deploy if the live checkout has commits or edits not on GitHub.
#
# Same posture as ci.yml: read-only token, pinned actions, no pull_request trigger, so a PR can
# never reach the deploy key.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# No concurrency group: a cancelled run shows as a failed check on its
# commit. The gate on terp serializes deploys (flock), a job whose commit is
# no longer master's head skips and passes, and a deploy the gate refuses
# because a newer commit is already live passes as superseded too.

permissions:
  contents: read

env:
  TERP_HOST: 5.188.124.62
  TERP_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIObUWrM7CxDC8VuXpP9FGykhelefOxfFj+cthroe5/c8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.superseded != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.head.outputs.superseded != 'true'
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts
        if: steps.head.outputs.superseded != 'true'

      - run: npm run build
        if: steps.head.outputs.superseded != 'true'

      - run: test -f dist/serviceWorker.js
        if: steps.head.outputs.superseded != 'true'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.head.outputs.superseded != 'true'
        env:
          TERP_DEPLOY_KEY: ${{ secrets.TERP_DEPLOY_KEY }}
        run: |
          if [[ -z "$TERP_DEPLOY_KEY" ]]; then
            echo "::error::TERP_DEPLOY_KEY secret is not set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TERP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$TERP_HOST $TERP_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.sha }} to terp
        if: steps.head.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ssh -o BatchMode=yes "root@$TERP_HOST" deploy "$GITHUB_SHA" && exit 0
          rc=$?
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || exit $rc
          [[ $head != "$GITHUB_SHA" ]] || exit $rc
          echo "::notice::superseded by $head; the gate refused this older commit"
          echo superseded=true >>"$GITHUB_ENV"

      # terp's :443 only admits the edge fleet; the gate already health-checked :8081 locally.
      - name: Verify site responds
        if: steps.head.outputs.superseded != 'true' && env.superseded != 'true'
        run: |
          curl -fsS -m 20 -o /dev/null -w 'site %{http_code}\n' https://stomp.fracit.al/
          curl -fsS -m 20 https://stomp.fracit.al/api/status
