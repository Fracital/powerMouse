# Build every push to master, then deploy it to terp as https://stomp.fracit.al/.
#
# terp is VM 116 on the Proxmox host divide (since 2026-11-16), on divide's private network
# (172.16.5.62) with no public address. The deploy job runs on the self-hosted runner
# divide-deploy (CT 204 on divide, 172.16.5.204, labels divide + deploy), the only guest divide's
# firewall lets reach terp's tcp/22. Its runner group (deploy) admits only this repository and
# only .github/workflows/deploy.yml at refs/heads/master, so a fork's pull request can never
# get a job onto it. The other jobs stay on GitHub's runners.
#
# TERP_DEPLOY_KEY is an SSH key that terp pins to /usr/local/sbin/stomp-deploy-gate (source:
# deploy/terp-deploy-gate.sh, installed by hand, CI never updates it). The only command it accepts
# is `deploy <sha>`: terp fetches that commit from GitHub, runs npm ci + build in /opt/stomp/stage,
# swaps /opt/stomp/repo to it, restarts pm2 `stomp`, health-checks :8081 and rolls back on failure.
# It refuses to deploy if the live checkout has commits or edits not on GitHub.
#
# The runner is persistent, so the key lives only in the job's $RUNNER_TEMP, beside its own
# known_hosts, and is removed when the job ends however it ends; the runner user's ~/.ssh is
# never touched. The runner has git, curl, jq and ssh (no Node, no gh): the job needs nothing
# else.
#
# Same posture as ci.yml: read-only token, pinned actions, no pull_request trigger, so a PR can
# never reach the deploy key.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# No concurrency group: a cancelled run shows as a failed check on its
# commit. The gate on terp serializes deploys (flock), a job whose commit is
# no longer master's head skips and passes, and a deploy the gate refuses
# because a newer commit is already live passes as superseded too.

permissions:
  contents: read

env:
  TERP_HOST: 172.16.5.62
  TERP_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIObUWrM7CxDC8VuXpP9FGykhelefOxfFj+cthroe5/c8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/commits/master" --jq .sha 2>/dev/null) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.superseded != 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.head.outputs.superseded != 'true'
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts
        if: steps.head.outputs.superseded != 'true'

      - run: npm run build
        if: steps.head.outputs.superseded != 'true'

      - run: test -f dist/serviceWorker.js
        if: steps.head.outputs.superseded != 'true'

  deploy:
    needs: build
    runs-on: [self-hosted, deploy]
    timeout-minutes: 15
    outputs:
      superseded: ${{ steps.head.outputs.superseded || steps.ship.outputs.superseded }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # master's head by the REST API (no gh on the runner); any failure to ask
      # counts as "still the head", as before
      - name: Still master's head?
        id: head
        if: github.event_name == 'push'
        run: |
          head=$(curl -fsS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/commits/master" | jq -er .sha) || head=$GITHUB_SHA
          if [[ $head != "$GITHUB_SHA" ]]; then
            echo "::notice::superseded by $head, skipped"
            echo superseded=true >>"$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.head.outputs.superseded != 'true'
        env:
          TERP_DEPLOY_KEY: ${{ secrets.TERP_DEPLOY_KEY }}
        run: |
          if [[ -z "$TERP_DEPLOY_KEY" ]]; then
            echo "::error::TERP_DEPLOY_KEY secret is not set"
            exit 1
          fi
          dir="$RUNNER_TEMP/terp-ssh"
          install -d -m 700 "$dir"
          (umask 077 && printf '%s\n' "$TERP_DEPLOY_KEY" >"$dir/key")
          echo "$TERP_HOST $TERP_HOST_KEY" >"$dir/known_hosts"

      - name: Deploy ${{ github.sha }} to terp
        id: ship
        if: steps.head.outputs.superseded != 'true'
        run: |
          dir="$RUNNER_TEMP/terp-ssh"
          ssh -F /dev/null -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            "root@$TERP_HOST" deploy "$GITHUB_SHA" && exit 0
          rc=$?
          head=$(curl -fsS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/commits/master" | jq -er .sha) || exit $rc
          [[ $head != "$GITHUB_SHA" ]] || exit $rc
          echo "::notice::superseded by $head; the gate refused this older commit"
          echo superseded=true >>"$GITHUB_OUTPUT"

      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/terp-ssh"

  # From GitHub's side, as a visitor sees it (Cloudflare to terp); the gate
  # already health-checked :8081 on terp itself.
  verify:
    needs: deploy
    if: needs.deploy.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify site responds
        run: |
          curl -fsS -m 20 -o /dev/null -w 'site %{http_code}\n' https://stomp.fracit.al/
          curl -fsS -m 20 https://stomp.fracit.al/api/status
