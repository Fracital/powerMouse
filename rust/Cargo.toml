# The Rust side of stomp: every crate here is built to wasm32 by
# deploy/rust/build.sh in the pinned toolchain container and shipped from
# assets/ (docs/rust-plan.md). One release profile for all of them: whole
# program optimization, one codegen unit, and panics that abort (a trap the
# loader treats as a dead instance), so no unwinding tables and no panic
# strings reach the artifact.
[workspace]
members = ["edits", "rwjs", "rwcss", "block", "suffix", "core-module", "rtc", "codec"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

# oxc's parser (with its lexer, a third of a script's rewrite at opt-level
# z) is built for speed: on the bench corpus a rewrite takes about 11% less
# time for 123 KB more of core.wasm (25 KB more brotli). So are the
# rewriter's walk (rwjs, all but its linker and its printer, which run
# rarely and are built for size by `#[optimize(size)]`) and the edits it
# makes (edits): over the site corpus (4,018 scripts, 323 MB) through the
# rewrite worker's glue a rewrite takes 8.3% less time, the twelve largest
# scripts 9.9% less, for 171,665 bytes more (27,413 brotli). V8 compiles a
# module's function on its first call: the first rewrite after a compile
# takes about 1 ms longer with the larger functions (a 5 KB script, 6.6 ms
# against 7.8; a 204 KB one 13.9 against 14.3 more than its second). At
# "s" the walk saves 7% for 105 KB; everything else, the CSS scanner and
# the suffix lookup among it, stays at z.
[profile.release.package.oxc_parser]
opt-level = 3

[profile.release.package.rwjs]
opt-level = 3

[profile.release.package.edits]
opt-level = 3

# str0m-rust-crypto 0.7.0 as published, minus dimpl's `rcgen` feature: it
# generates the DTLS certificate with rcgen on aws-lc-rs (C, no wasm build);
# the WebRTC worker generates the certificate with WebCrypto instead and
# hands it to the stack (rust/vendor/str0m-rust-crypto/src/dtls.rs)
#
# str0m 0.25.0 as published plus rust/patches/str0m-0.25.0.patch (an empty
# data channel message is sent, RFC 8831 6.6): deploy/rust/patches.sh makes
# rust/patched/str0m in the build container from the checked crate; so
# too sctp-proto and is (str0m's ICE agent, which checks its pairs on
# Chrome's schedule), each with its patch there (rust/patches/crates)
[patch.crates-io]
str0m-rust-crypto = { path = "vendor/str0m-rust-crypto" }
str0m = { path = "patched/str0m" }
sctp-proto = { path = "patched/sctp-proto" }
is = { path = "patched/is" }
