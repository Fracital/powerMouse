[package]
name = "rwjs"
version = "0.1.0"
edition = "2024"
description = "the JS rewriter of stomp, built to wasm (docs/rust-plan.md)"
license = "GPL-3.0-only"
publish = false

[dependencies]
edits = { path = "../edits" }
# the parser and the AST walk alone: no semantic pass, no codegen, no
# regular expression parsing (a pattern's text is kept as written)
oxc = { version = "=0.158.0", default-features = false, features = ["ast_visit"] }
