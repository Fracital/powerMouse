[package]
name = "stomp-h3"
version = "0.1.0"
edition = "2021"
description = "HTTP/3 over QUIC for stomp, run over a datagram channel the host supplies (a wisp UDP stream)"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-compression = { version = "0.4", features = ["futures-io", "gzip", "brotli"] }
bytes = "1"
fastrand = "2"
futures-util = { version = "0.3", features = ["io", "sink", "channel"] }
futures-channel = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
http = "1"
js-sys = "=0.3.77"
quinn = { version = "=0.11.12", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "brotli"] }
ml-kem = "0.2.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rustls-pemfile = "2"
send_wrapper = "0.6"
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
wasm-streams = "0.4"
web-sys = { version = "=0.3.77", features = ["ReadableStream", "ReadableStreamDefaultReader", "WritableStream", "WritableStreamDefaultWriter", "console"] }
web-time = "1"
webpki-roots = "1"

[dependencies.getrandom02]
package = "getrandom"
version = "0.2"
features = ["js"]

[dependencies.ring]
version = "0.17"
features = ["wasm32_unknown_unknown_js"]

[dependencies.rustls-pki-types]
version = "1"
features = ["web"]

# h3 with patches/h3 applied (vendor.sh unpacks it)
[patch.crates-io]
h3 = { path = "vendor/h3" }
# rustls with deploy/epoxy/patches/rustls applied (Chrome's ClientHello)
rustls = { path = "vendor/rustls" }
# quinn-proto with patches/quinn-proto (Chrome's client transport parameters)
quinn-proto = { path = "vendor/quinn-proto" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
